name: CI / Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            plugins/*/pyproject.toml
      - name: Install OpenMP on macOS
        if: runner.os == 'macOS'
        run: brew list libomp || brew install libomp
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' -e plugins/a158 -e plugins/a158_enhanced coverage
      - name: Run isolated unit and plugin tests
        run: >-
          coverage run --source=axonx,axonx_alpha158,axonx_alpha158_enhanced
          -m pytest tests/unit plugins/a158_enhanced/tests
          -m 'not integration' --tb=short --junitxml=test-results/junit.xml
      - name: Report coverage
        run: |
          coverage report -m
          coverage xml -o test-results/coverage.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
