name: Release / AxonX

run-name: Release ${{ github.event.release.tag_name || format('v{0}', inputs.version) }} (${{ inputs.publish_target || 'both' }})

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from its existing v<version> tag (without v)
        required: true
        type: string
      publish_target:
        description: Packages to publish (Studio includes PyPI and npm)
        required: true
        default: both
        type: choice
        options: [both, backend, studio]

permissions:
  contents: read

concurrency:
  group: publish-axonx
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/ci-python-tests.yml
    with:
      ref: ${{ format('refs/tags/{0}', github.event.release.tag_name || format('v{0}', inputs.version)) }}

  build-backend:
    needs: tests
    uses: ./.github/workflows/_build-python-packages.yml
    with:
      ref: ${{ format('refs/tags/{0}', github.event.release.tag_name || format('v{0}', inputs.version)) }}
      expected_version: ${{ github.event.release.tag_name || inputs.version }}

  build-studio:
    needs: tests
    uses: ./.github/workflows/_build-studio-packages.yml
    with:
      ref: ${{ format('refs/tags/{0}', github.event.release.tag_name || format('v{0}', inputs.version)) }}
      expected_version: ${{ github.event.release.tag_name || inputs.version }}

  publish-pypi:
    name: Publish ${{ matrix.package }} to PyPI
    needs: [build-backend, build-studio]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.publish_target == 'backend' && '["backend"]' || inputs.publish_target == 'studio' && '["studio"]' || '["backend", "studio"]') }}
    env:
      PACKAGE_DIR: ${{ matrix.package == 'backend' && 'dist/axonx' || 'dist/python' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package == 'backend' && 'python-distributions' || 'studio-distributions' }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install publishing tools
        run: python -m pip install 'twine>=7,<8' pypi-attestations
      - name: Check package metadata
        run: python -m twine check "${PACKAGE_DIR}"/*
      - name: Generate publish attestations
        id: attestations
        continue-on-error: true
        timeout-minutes: 2
        run: python -m pypi_attestations sign "${PACKAGE_DIR}"/*
      - name: Publish to PyPI
        env:
          ATTESTATIONS_OUTCOME: ${{ steps.attestations.outcome }}
        run: |
          args=()
          if [[ "${ATTESTATIONS_OUTCOME}" == 'success' ]]; then
            args+=(--attestations)
          else
            echo '::warning::Attestation generation failed; publishing without attestations using Trusted Publishing.'
          fi
          python -m twine upload --non-interactive "${args[@]}" "${PACKAGE_DIR}"/*

  publish-studio-npm:
    if: inputs.publish_target != 'backend'
    needs: [build-studio, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-distributions
          path: dist
      - name: Publish Studio to npm
        env:
          NPM_TAG: ${{ contains(needs.build-studio.outputs.version, '-') && 'next' || 'latest' }}
        run: npm publish dist/npm/*.tgz --access public --tag "${NPM_TAG}" --provenance
