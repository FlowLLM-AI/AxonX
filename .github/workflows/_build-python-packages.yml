name: _Build Python packages

on:
  workflow_call:
    inputs:
      expected_version:
        description: Expected AxonX release version
        required: false
        type: string
        default: ''
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  distributions:
    name: Build and verify Python packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            plugins/*/pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and sdist for each package
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python -m build --outdir dist/axonx
          python -m build plugins/a158 --outdir dist/a158
          python -m build plugins/a158_enhanced --outdir dist/a158_enhanced
          python -m twine check dist/*/*
          python .github/scripts/verify-packages.py --expected-version "${EXPECTED_VERSION}"
      - name: Verify isolated installation and entry points
        run: |
          python -m venv "${RUNNER_TEMP}/axonx-package-smoke"
          "${RUNNER_TEMP}/axonx-package-smoke/bin/python" -m pip install dist/*/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/axonx-package-smoke/bin/python" \
            "${GITHUB_WORKSPACE}/.github/scripts/verify-packages.py" --installed
          "${RUNNER_TEMP}/axonx-package-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/axonx-package-smoke/bin/axonx" help
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*/*
          if-no-files-found: error
          retention-days: 14
