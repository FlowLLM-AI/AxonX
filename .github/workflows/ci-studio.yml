name: CI / AxonX Studio

on:
  push:
    branches: [main]
    paths:
      - 'axonx/**'
      - 'pyproject.toml'
      - 'scripts/generate_studio_contracts.py'
      - 'scripts/package_studio.py'
      - 'axonx_studio/**'
      - '.github/workflows/ci-studio.yml'
      - '.github/workflows/_build-studio-packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'axonx/**'
      - 'pyproject.toml'
      - 'scripts/generate_studio_contracts.py'
      - 'scripts/package_studio.py'
      - 'axonx_studio/**'
      - '.github/workflows/ci-studio.yml'
      - '.github/workflows/_build-studio-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Build and verify Studio distributions
    uses: ./.github/workflows/_build-studio-packages.yml
