name: CI / Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'github-pages/**', 'README*.md', 'CONTRIBUTING*.md', 'plugins/a158/**', 'plugins/a158_factor/**', 'plugins/a158_strategy/**', 'axonx_studio/**', '.github/workflows/docs.yml', '.github/scripts/write-traffic-badge*']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'github-pages/**', 'README*.md', 'CONTRIBUTING*.md', 'plugins/a158/**', 'plugins/a158_factor/**', 'plugins/a158_strategy/**', 'axonx_studio/**', '.github/workflows/docs.yml', '.github/scripts/write-traffic-badge*']
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            github-pages/package-lock.json
            axonx_studio/package-lock.json
      - run: npm ci
        working-directory: github-pages
      - run: npm ci
        working-directory: axonx_studio
      - run: npm run test
        working-directory: github-pages
      - run: npm run build
        working-directory: github-pages
        env:
          DOCS_BASE: /AxonX/
      - name: Test traffic badge validation
        run: node --test .github/scripts/write-traffic-badge.test.mjs
      - name: Generate public clone badge
        run: node .github/scripts/write-traffic-badge.mjs github-pages/dist/badges/clones.json
        env:
          AXONX_TRAFFIC_TOKEN: ${{ github.event_name != 'pull_request' && secrets.AXONX_TRAFFIC_TOKEN || '' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: github-pages/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
