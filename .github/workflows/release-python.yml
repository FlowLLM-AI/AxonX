name: Release / AxonX Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: AxonX version to publish from its v<version> tag (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-axonx
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/ci-python-tests.yml
    with:
      ref: ${{ format('refs/tags/{0}', github.event.release.tag_name || format('v{0}', inputs.version)) }}

  build:
    needs: tests
    uses: ./.github/workflows/_build-python-packages.yml
    with:
      ref: ${{ format('refs/tags/{0}', github.event.release.tag_name || format('v{0}', inputs.version)) }}
      expected_version: ${{ github.event.release.tag_name || inputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install publishing tools
        run: python -m pip install 'twine>=7,<8' pypi-attestations
      - name: Check package metadata
        run: python -m twine check dist/axonx/*
      - name: Generate publish attestations
        id: attestations
        continue-on-error: true
        timeout-minutes: 2
        run: python -m pypi_attestations sign dist/axonx/*
      - name: Publish AxonX
        env:
          ATTESTATIONS_OUTCOME: ${{ steps.attestations.outcome }}
        run: |
          args=()
          if [[ "${ATTESTATIONS_OUTCOME}" == 'success' ]]; then
            args+=(--attestations)
          else
            echo '::warning::Attestation generation failed; publishing without attestations using Trusted Publishing.'
          fi
          python -m twine upload --non-interactive "${args[@]}" dist/axonx/*
