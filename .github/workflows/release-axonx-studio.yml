name: Release / AxonX Studio

run-name: Publish AxonX Studio from main (${{ inputs.publish_target }})

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Packages to publish
        required: true
        default: both
        type: choice
        options: [both, pypi, npm]

permissions:
  contents: read

concurrency:
  group: publish-axonx-studio
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build-studio-packages.yml

  publish-python:
    if: inputs.publish_target != 'npm'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-distributions
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install publishing tools
        run: python -m pip install 'twine>=7,<8' pypi-attestations
      - name: Check package metadata
        run: python -m twine check dist/python/*
      - name: Generate publish attestations
        id: attestations
        continue-on-error: true
        timeout-minutes: 2
        run: python -m pypi_attestations sign dist/python/*
      - name: Publish Studio to PyPI
        env:
          ATTESTATIONS_OUTCOME: ${{ steps.attestations.outcome }}
        run: |
          args=()
          if [[ "${ATTESTATIONS_OUTCOME}" == 'success' ]]; then
            args+=(--attestations)
          else
            echo '::warning::Attestation generation failed; publishing without attestations using Trusted Publishing.'
          fi
          python -m twine upload --non-interactive "${args[@]}" dist/python/*

  publish-npm:
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (inputs.publish_target == 'npm' ||
       (inputs.publish_target == 'both' && needs.publish-python.result == 'success'))
    needs: [build, publish-python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-distributions
          path: dist
      - name: Publish Studio to npm
        env:
          NPM_TAG: ${{ contains(needs.build.outputs.version, '-') && 'next' || 'latest' }}
        run: npm publish dist/npm/*.tgz --access public --tag "${NPM_TAG}" --provenance
