name: Release / AxonX Studio

run-name: Publish AxonX Studio from main (${{ inputs.publish_target }})

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Packages to publish
        required: true
        default: both
        type: choice
        options: [both, pypi, npm]

permissions:
  contents: read

concurrency:
  group: publish-axonx-studio
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build-studio-packages.yml

  publish-python:
    if: inputs.publish_target != 'npm'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-distributions
          path: dist
      - name: Publish Studio to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/python

  publish-npm:
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (inputs.publish_target == 'npm' ||
       (inputs.publish_target == 'both' && needs.publish-python.result == 'success'))
    needs: [build, publish-python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-distributions
          path: dist
      - name: Publish Studio to npm
        env:
          NPM_TAG: ${{ contains(needs.build.outputs.version, '-') && 'next' || 'latest' }}
        run: npm publish dist/npm/*.tgz --access public --tag "${NPM_TAG}" --provenance
