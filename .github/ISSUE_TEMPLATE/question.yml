name: Usage question
description: Ask about setup or using AxonX
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation](https://flowllm-ai.github.io/AxonX/en/docs) and search existing issues first.
        Remove credentials and private data from examples.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Goal and attempts
      description: Describe what you want to accomplish, what you tried, and relevant documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant versions and examples
      description: Include relevant AxonX/Studio/plugin versions, OS, commands, or sanitized configuration
