name: Bug report
description: Report unexpected behavior with reproduction evidence
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a bug.
        Remove tokens, credentials, private data, and sensitive machine addresses from logs, configuration, and screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Core
        - Task runtime
        - Research plugin
        - CLI
        - HTTP API
        - MCP / Agent
        - Studio
        - Installation or packaging
        - Documentation
        - Other or unsure
    validations:
      required: true
  - type: dropdown
    id: reproduction-status
    attributes:
      label: Reproduction status
      options:
        - Reproduced
        - Observed but not consistently reproduced
        - Suspected from static analysis
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and its impact
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps or analysis evidence
      description: Include minimal commands, code, or sanitized configuration. For an unconfirmed issue, identify the code path and explain the suspected failure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior or suspected failure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Include AxonX version and OS; add Studio/plugin versions, Python/Node versions, browser, and installation method when relevant
      placeholder: |
        AxonX:
        OS:
        Studio / plugin:
        Python / Node / browser:
        Installation method:
    validations:
      required: true
  - type: dropdown
    id: execution-target
    attributes:
      label: Execution target
      description: For remote execution, describe the selected target without sharing credentials or private addresses
      options:
        - Local
        - Remote target
        - Both
        - Not applicable or unsure
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and task state
      description: Include the task type, status, and error excerpt when relevant. Do not upload the entire .axonx workspace
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, sanitized target details, or related issues
