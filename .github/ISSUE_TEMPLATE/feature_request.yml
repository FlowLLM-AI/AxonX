name: Feature request
description: Describe a research or development need
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before suggesting a feature.
  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Core
        - Task runtime
        - Research plugin
        - CLI
        - HTTP API
        - MCP / Agent
        - Studio
        - Installation or packaging
        - Documentation
        - Other or unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What are you trying to accomplish, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the outcome, with an example when useful
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Mention possible changes to CLI/API/configuration, task records, lifecycle, or artifact formats
