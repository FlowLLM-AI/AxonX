tasks:
  sales: axonx_polars_demo.sales:SalesTask
jobs:
  polars_sales:
    description: Submit the Polars sales aggregation task.
    parameters:
      type: object
      properties:
        output:
          type: string
          description: Filesystem path of the Parquet file to write.
        input:
          type: string
          description: Optional filesystem path of an input CSV file; built-in demo data is used when omitted.
      required:
        - output
    steps:
      - backend: submit_task
    defaults:
      task: sales
