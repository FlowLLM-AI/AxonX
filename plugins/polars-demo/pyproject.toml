[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "axonx-polars-demo"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = ["axonx>=0.1.0", "polars>=1"]
[project.entry-points."axonx.plugins"]
polars-demo = "axonx_polars_demo"
[tool.setuptools.packages.find]
where = ["src"]
include = ["axonx_polars_demo*"]
[tool.setuptools.package-data]
axonx_polars_demo = ["plugin.yaml"]
