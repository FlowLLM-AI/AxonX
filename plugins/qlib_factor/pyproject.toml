[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axonx-qlib-factor"
version = "0.3.0"
description = "AxonX research plugin extending Alpha158 with selectable market moments, neutral momentum, and risk features for factor experiments."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "FlowLLM AI", email = "FlowLLM-AI@users.noreply.github.com" },
]
keywords = [
    "axonx",
    "plugins",
    "qlib",
    "quantitative-finance",
    "quantitative-research",
    "alpha158",
    "context-features",
    "factor-research",
    "factor-analysis",
    "lightgbm",
    "backtesting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "axonx>=0.3.1",
    "axonx-qlib-a158>=0.3.0",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/FlowLLM-AI/AxonX/tree/main/plugins/qlib_factor"
Documentation = "https://flowllm-ai.github.io/AxonX/en/plugins/qlib-factor"
Issues = "https://github.com/FlowLLM-AI/AxonX/issues"
Source = "https://github.com/FlowLLM-AI/AxonX"

[project.entry-points."axonx.plugins"]
qlib_factor = "axonx_qlib_factor"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = ["axonx_qlib_factor", "axonx_qlib_factor.*"]

[tool.setuptools.package-data]
axonx_qlib_factor = ["plugin.yaml"]
