extends: default

components:
  proxy:
    tushare:
      backend: http
      upstream_base_url: ${AXONX_TUSHARE_BASE_URL}
      request_secret: ${AXONX_TUSHARE_TOKEN}
      request_secret_json_path: token
      json_overrides:
        token: ${AXONX_TUSHARE_TOKEN}
        params.ts_type_name: ${AXONX_TUSHARE_BASE_URL}

jobs:
  tushare_proxy:
    backend: proxy
    component: tushare
    path_prefix: /tushare
    methods:
      - POST
    max_request_bytes: 1048576
