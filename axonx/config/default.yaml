remote_nodes: []
components:
  plugin:
    default:
      backend: local
      auto_install: true
      allow_remote_install: false
  task_manager:
    default:
      backend: local
      max_concurrency: 1
  machine:
    default:
      backend: machine
jobs:
  list_plugins:
    description: List installed Task plugins.
    steps:
      - backend: list_plugins_step
  machine_status:
    description: Get local or remote AxonX machine status.
    parameters:
      type: object
      properties:
        address:
          type: string
          description: Optional configured remote AxonX address in IP:PORT format.
    steps:
      - backend: machine_status_step
  list_machines:
    description: Check the health of all configured remote AxonX machines.
    steps:
      - backend: list_machines_step
  demo:
    description: Show the installed AxonX version.
    steps:
      - backend: version_step
      - backend: demo_step
  submit:
    description: Submit a task for asynchronous execution.
    parameters:
      type: object
      properties:
        task:
          type: string
          description: Registered task name.
        manager:
          type: string
          description: Task manager name.
        suffix:
          type: string
          pattern: '^[A-Za-z0-9-]{1,32}$'
      required: [ task ]
      additionalProperties: true
    steps:
      - backend: submit_task
  list:
    description: List all task IDs.
    parameters:
      type: object
      properties:
        manager: { type: string }
    steps:
      - backend: list_tasks
  status:
    description: Get one task status.
    parameters:
      type: object
      properties:
        task_id: { type: string }
        manager: { type: string }
      required: [ task_id ]
    steps:
      - backend: get_task_status
  wait:
    description: Wait for a task run to finish.
    parameters:
      type: object
      properties:
        task_id: { type: string }
        manager: { type: string }
        timeout: { type: number, exclusiveMinimum: 0 }
      required: [ task_id ]
    steps:
      - backend: wait_task
  cancel:
    description: Cancel a queued or running task.
    parameters:
      type: object
      properties:
        task_id: { type: string }
        manager: { type: string }
      required: [ task_id ]
    steps:
      - backend: cancel_task
  logs:
    description: Read output from a task run.
    parameters:
      type: object
      properties:
        task_id: { type: string }
        manager: { type: string }
        limit: { type: integer, minimum: 1 }
      required: [ task_id ]
    steps:
      - backend: task_logs
