remote_nodes:
  - host_ip: 11.160.132.45
    host_port: 1024

components:
  task_graph:
    default:
      backend: local

  plugin:
    default:
      backend: local
      auto_install: true
      allow_remote_install: true

  task_manager:
    default:
      backend: local
      terminate_grace_seconds: 5

  machine:
    default:
      backend: machine

jobs:
  list_plugins:
    description: List installed plugins and their contributions.
    steps:
      - backend: list_plugins_step

  status_plugins:
    description: Show the saved status of one managed plugin.
    parameters:
      type: object
      properties:
        plugin:
          type: string
          minLength: 1
          description: Name of the managed plugin to query.
      required: [plugin]
    steps:
      - backend: status_plugins_step

  inspect_plugins:
    description: Inspect one managed plugin wheel on this service machine.
    parameters:
      type: object
      properties:
        plugin:
          type: string
          minLength: 1
          description: Name of the managed plugin wheel to inspect.
      required: [plugin]
    steps:
      - backend: inspect_plugins_step

  machine_status:
    description: Get local or remote AxonX machine status.
    steps:
      - backend: machine_status_step

  list_machines:
    description: Check the health of all configured remote AxonX machines.
    enable_remote: false
    steps:
      - backend: list_machines_step

  demo:
    description: Show the installed AxonX version.
    steps:
      - backend: version_step
      - backend: demo_step

  shell:
    description: Execute a shell command on the selected AxonX machine.
    parameters:
      type: object
      properties:
        command:
          type: string
          minLength: 1
          description: Shell command to execute.
        timeout:
          type: number
          exclusiveMinimum: 0
          maximum: 300
          default: 30
          description: Maximum execution time in seconds.
      required: [command]
      additionalProperties: false
    steps:
      - backend: shell_step

  submit:
    description: Submit a task for asynchronous execution.
    parameters:
      type: object
      properties:
        task:
          type: string
          description: Registered task name.
      required:
        - task
      additionalProperties: true
    steps:
      - backend: submit_task

  list_runtime_task_ids:
    description: List all runtime Task IDs.
    steps:
      - backend: list_runtime_task_ids

  list_runtime_task_statuses:
    description: List complete status snapshots for all runtime Tasks.
    steps:
      - backend: list_runtime_task_statuses

  list_installed_task_definitions:
    description: List all installed Task definitions.
    steps:
      - backend: list_installed_task_definitions

  set_status:
    description: Store a complete status reported by a task process.
    parameters:
      type: object
      properties:
        task_id:
          type: string
          description: ID of the task the reported status belongs to.
        status:
          type: object
          description: Complete TaskStatus snapshot reported by the task process.
      required:
        - task_id
        - status
    steps:
      - backend: set_task_status

  status:
    description: Get one task status.
    parameters:
      type: object
      properties:
        task_id:
          type: string
          description: ID of the task whose status is requested.
      required:
        - task_id
    steps:
      - backend: get_task_status

  read_task_log:
    description: Read a bounded byte range from one Task log.
    parameters:
      type: object
      properties:
        task_id:
          type: string
          description: ID of the task whose log is read.
        offset:
          type: integer
          minimum: -1
          default: -1
          description: Byte offset to start reading from; negative values read the tail of the log.
        limit:
          type: integer
          minimum: 1024
          maximum: 262144
          default: 65536
          description: Maximum number of bytes to return.
      required:
        - task_id
    steps:
      - backend: read_task_log

  list_workspace_entries:
    description: List one directory inside the configured workspace.
    parameters:
      type: object
      properties:
        path:
          type: string
          default: ""
          description: Workspace-relative directory to list; empty string lists the workspace root.
        require_metadata:
          type: boolean
          default: false
          description: Skip task directories that do not contain metadata.json.
      additionalProperties: false
    steps:
      - backend: list_workspace_entries_step

  list_task_graphs:
    description: List ETL roots or search all Alpha158 task artifacts.
    parameters:
      type: object
      properties:
        q:
          type: string
          default: ""
          description: Search query over task artifacts; empty string lists the ETL roots.
        offset:
          type: integer
          minimum: 0
          default: 0
          description: Number of results to skip.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum number of results to return.
      additionalProperties: false
    steps:
      - backend: list_task_graphs_step

  get_task_graph:
    description: Return the full ETL graph containing a task artifact.
    parameters:
      type: object
      properties:
        task_id:
          type: string
          description: ID of the task artifact whose ETL graph is returned.
      required:
        - task_id
      additionalProperties: false
    steps:
      - backend: get_task_graph_step

  preview_workspace_file:
    description: Preview one supported file inside the configured workspace.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Workspace-relative path of the file to preview.
        offset:
          type: integer
          minimum: 0
          default: 0
          description: Number of rows to skip for row-based previews such as CSV.
        limit:
          type: integer
          minimum: 1
          maximum: 5000
          default: 200
          description: Maximum number of rows to return for row-based previews such as CSV.
        full:
          type: boolean
          default: false
          description: Return every Parquet row instead of the sampled preview.
      required:
        - path
      additionalProperties: false
    steps:
      - backend: preview_workspace_file_step

  delete_workspace_entry:
    description: Delete one file or directory inside the configured workspace.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Workspace-relative path of the file or directory to delete.
      required:
        - path
      additionalProperties: false
    steps:
      - backend: delete_workspace_entry_step

  delete_workspace_entries:
    description: Delete multiple files or directories inside the configured workspace.
    parameters:
      type: object
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 200
          description: Workspace-relative paths of the files or directories to delete.
          items:
            type: string
            minLength: 1
      required:
        - paths
      additionalProperties: false
    steps:
      - backend: delete_workspace_entries_step

  cancel:
    description: Cancel a queued or running task.
    parameters:
      type: object
      properties:
        task_id:
          type: string
          description: ID of the queued or running task to cancel.
      required:
        - task_id
    steps:
      - backend: cancel_task

  delete_tasks:
    description: Delete multiple completed Task records.
    parameters:
      type: object
      properties:
        task_ids:
          type: array
          description: IDs of the completed tasks to delete.
          items:
            type: string
          minItems: 1
          uniqueItems: true
      required:
        - task_ids
    steps:
      - backend: delete_tasks
