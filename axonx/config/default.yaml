remote_nodes: []
components:
  plugin:
    default:
      backend: local
      auto_install: true
      allow_remote_install: true
  task_manager:
    default:
      backend: local
  machine:
    default:
      backend: machine
jobs:
  list_plugins:
    description: List installed Task plugins.
    steps:
      - backend: list_plugins_step
  machine_status:
    description: Get local or remote AxonX machine status.
    steps:
      - backend: machine_status_step
  list_machines:
    description: Check the health of all configured remote AxonX machines.
    enable_remote: false
    steps:
      - backend: list_machines_step
  demo:
    description: Show the installed AxonX version.
    steps:
      - backend: version_step
      - backend: demo_step
  submit:
    description: Submit a task for asynchronous execution.
    parameters:
      type: object
      properties:
        task:
          type: string
          description: Registered task name.
      required:
        - task
      additionalProperties: true
    steps:
      - backend: submit_task
  list:
    description: List all task IDs.
    steps:
      - backend: list_tasks
  set_status:
    description: Store a complete status reported by a task process.
    parameters:
      type: object
      properties:
        task_id:
          type: string
        status:
          type: object
      required:
        - task_id
        - status
    steps:
      - backend: set_task_status
  status:
    description: Get one task status.
    parameters:
      type: object
      properties:
        task_id:
          type: string
      required:
        - task_id
    steps:
      - backend: get_task_status
  cancel:
    description: Cancel a queued or running task.
    parameters:
      type: object
      properties:
        task_id:
          type: string
      required:
        - task_id
    steps:
      - backend: cancel_task
