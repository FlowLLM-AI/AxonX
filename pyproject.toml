[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axonx"
version = "0.1.0"
description = "An asynchronous component, job, plugin, and isolated task runtime for Python applications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "FlowLLM AI", email = "FlowLLM-AI@users.noreply.github.com" },
]
keywords = ["asyncio", "jobs", "orchestration", "plugins", "task-runner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "croniter>=6.2.4",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.3,<5",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.26.0,<5",
    "loguru>=0.7.3,<1",
    "matplotlib>=3.11.2,<4",
    "packaging>=26.3",
    "pandas>=3.0.5,<4",
    "psutil>=7.2.2,<8",
    "pydantic>=2.13.5,<3",
    "polars>=1.44.2,<2",
    "pyarrow>=25.0.1,<26",
    "PyYAML>=6.0.3,<7",
    "requests>=2.34.2,<3",
    "rich>=15.0.0,<16",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
    "watchfiles>=1.2.0,<2",
    "claude-agent-sdk>=0.2.157",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
axonx = "axonx.cli:main"

[project.urls]
Homepage = "https://github.com/FlowLLM-AI/AxonX"
Documentation = "https://github.com/FlowLLM-AI/AxonX#readme"
Issues = "https://github.com/FlowLLM-AI/AxonX/issues"
Source = "https://github.com/FlowLLM-AI/AxonX"

[tool.setuptools.packages.find]
include = ["axonx*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "plugins/a158/src", "tests"]
testpaths = ["tests"]
# tests/integration needs API keys, so a bare `pytest` run must not pick it up.
# Run it explicitly with `pytest -m integration`.
addopts = '-m "not integration"'
markers = [
    "integration: needs API keys or live external services; run with `-m integration`",
]

[tool.setuptools.package-data]
axonx = ["config/*.yaml"]
