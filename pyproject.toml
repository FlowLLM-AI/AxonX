[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axonx"
dynamic = ["version"]
description = "Agent-native quantitative research harness. Help agents develop and improve research plugins, run experiments, and analyze traceable results through CLI, MCP, and Studio."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "FlowLLM AI", email = "FlowLLM-AI@users.noreply.github.com" },
]
keywords = [
    "agent-harness",
    "ai-agents",
    "quantitative-research",
    "quantitative-finance",
    "qlib",
    "factor-research",
    "backtesting",
    "mcp",
    "plugins",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio>=4,<5",
    "croniter>=6.2.4",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.10,<5",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.26.0,<5",
    "loguru>=0.7.3,<1",
    "packaging>=26.3",
    "pandas>=3.0.6,<4",
    "polars>=1.30,<2",
    "psutil>=7.2.2,<8",
    "pydantic>=2.13.5,<3",
    "python-multipart>=0.0.32,<1",
    "pyarrow>=25.0.1,<26",
    "PyYAML>=6.0.3,<7",
    "requests>=2.34.2,<3",
    "rich>=15.0.0,<16",
    "starlette>=1.6.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0,<2",
    "claude-agent-sdk>=0.2.157",
]

[project.optional-dependencies]
studio = ["axonx-studio>=0.1.0"]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
full = ["axonx[dev,studio]"]

[project.scripts]
axonx = "axonx.cli:main"

[project.urls]
Homepage = "https://flowllm-ai.github.io/AxonX/"
Documentation = "https://flowllm-ai.github.io/AxonX/en/docs"
Issues = "https://github.com/FlowLLM-AI/AxonX/issues"
Source = "https://github.com/FlowLLM-AI/AxonX"

[tool.setuptools.dynamic]
version = { attr = "axonx._version.VERSION" }

[tool.setuptools.packages.find]
include = ["axonx", "axonx.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "plugins/qlib_a158", "plugins/qlib_factor", "plugins/qlib_strategy", "tests"]
testpaths = ["tests", "plugins/qlib_factor/tests", "plugins/qlib_strategy/tests"]
# tests/integration needs API keys, so a bare `pytest` run must not pick it up.
# Run it explicitly with `pytest -m integration`.
addopts = '-m "not integration"'
markers = [
    "integration: needs API keys or live external services; run with `-m integration`",
]

[tool.setuptools.package-data]
axonx = ["config/*.yaml", "components/agent/guides/*.md"]
