repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args: [--extend-ignore=E203, --max-line-length=120]
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.1
    hooks:
      - id: pylint
        name: pylint (source)
        exclude: '(^docs/|(^|/)tests/|(_pb2|_pb2_grpc)\.py$)'
        args:
          - --persistent=n
          # Limit style constraints; keep errors enabled except optional-import/dynamic-member checks.
          - &pylint-disable-1 --disable=W0511,W0718,W1203,C0103,R0913,R0917,E0401,E1101
          # Ruff owns import ordering and grouping.
          - &pylint-disable-2 --disable=C0411,C0412,C0415,W0603,R1705,R0914,R0801
          - &pylint-disable-3 --disable=R0902,R0903,R0904
          - &pylint-disable-4 --disable=R1702,R0912,C0114,C0115,C0116
          - --max-statements=120
          - --max-line-length=120
          - --max-module-lines=1500
      - id: pylint
        alias: pylint-tests
        name: pylint (tests)
        files: '(^|/)tests/.*\.py$'
        args:
          - --persistent=n
          - *pylint-disable-1
          - *pylint-disable-2
          - *pylint-disable-3
          - *pylint-disable-4
          # Fixtures and assertions intentionally use names and internals from the code under test.
          - --disable=protected-access,redefined-outer-name,unused-argument
          - --max-statements=120
          - --max-line-length=120
          - --max-module-lines=1500
  - repo: https://github.com/regebro/pyroma
    rev: "5.0.1"
    hooks:
      - id: pyroma
        # Packaging metadata is checked explicitly, rather than on every commit.
        stages: [manual]
        args: [--min=10, .]
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend and docs)
        language: node
        entry: prettier --check --ignore-path .prettierignore
        additional_dependencies: [prettier@3.9.9]
        files: '^(?:(?:axonx_studio|github-pages|docs)/.*\.(?:ts|tsx|mts|js|mjs|json|css|html|vue|md)|(?:AGENTS|CLAUDE|README(?:_ZH)?|CONTRIBUTING(?:_ZH)?|module-dependencies)\.md|vercel\.json|\.pre-commit-config\.yaml)$'
      - id: studio-contracts
        name: Studio contracts match Python models
        language: system
        entry: python -m scripts.generate_studio_contracts --check
        pass_filenames: false
        files: '^(axonx/.*\.(py|yaml)|scripts/generate_studio_contracts\.py|axonx_studio/src/shared/api/contracts\.ts|axonx_studio/src/playground/job-contracts\.json)$'
      - id: agent-guides
        name: Agent resources and Skill match documentation
        language: system
        entry: python -m scripts.sync_agent_guides --check
        pass_filenames: false
        files: '^(docs/(en|zh)/dev_guide\.md|axonx/app/components/agent/guides/.*\.md|skills/axonx/SKILL\.md|scripts/sync_agent_guides\.py)$'
