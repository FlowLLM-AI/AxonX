<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Task records and artifact readers</title>
<desc id="desc">TaskExecutor writes metadata, progress and published artifacts. TaskIndex reads metadata for Studio and Agent queries. Research consumers read complete upstream artifacts and record their revisions.</desc>
<rect width="1200" height="360" rx="20" fill="#f3f7fb"/>
<g font-family="sans-serif" fill="#18344d">
<text x="40" y="55" font-size="30" font-weight="700">Task records and artifact readers</text>
<g fill="#fff" stroke="#88a7c1" stroke-width="2"><rect x="40" y="125" width="240" height="140" rx="12"/><rect x="370" y="125" width="360" height="140" rx="12"/><rect x="820" y="95" width="340" height="90" rx="12"/><rect x="820" y="225" width="340" height="90" rx="12"/></g>
<g font-size="22"><text x="65" y="172">TaskExecutor</text><text x="65" y="214" font-size="17">Publish current execution</text><text x="395" y="164">Task directory</text><text x="395" y="203" font-size="17">metadata.json · events.jsonl</text><text x="395" y="236" font-size="17">Published artifacts · persistent/</text><text x="845" y="133">TaskIndex → Studio / Agent</text><text x="845" y="164" font-size="17">Observe metadata and progress</text><text x="845" y="263">Research consumers</text><text x="845" y="295" font-size="17">Read complete upstream artifacts</text></g>
