<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="666" viewBox="0 0 1256 666" role="img" aria-labelledby="title desc">
  <title id="title">Workspace: records, artifacts, and external dependencies</title>
  <desc id="desc">The default workspace is .axonx; Task records do not bundle the whole research environment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1240.0" height="650.0" rx="30" fill="#f5f8fc" stroke="#18324b" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b">
      <text x="44" y="48" font-size="32" font-weight="700" text-anchor="start">Workspace: records, artifacts, and external dependencies</text>
      <text x="44" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">The default workspace is .axonx; Task records do not bundle the whole research environment.</text>
      <rect x="40" y="126" width="1120" height="68" rx="13.6" fill="#ffffff" stroke="#ccd9e5" stroke-width="1.6" stroke-linecap="round" />
      <text x="600.0" y="158" font-size="23" font-weight="700" text-anchor="middle">&lt;workspace&gt;/&lt;task_type&gt;/&lt;task_id&gt;/ </text>
      <rect x="40" y="220" width="250" height="142" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="252" font-size="23" font-weight="700" text-anchor="start">status.json</text>
      <text x="64.0" y="284" font-size="18" font-weight="400" text-anchor="start">Current state + run_id</text>
      <text x="64.0" y="311" font-size="18" font-weight="400" text-anchor="start">Progress / errors</text>
      <rect x="330" y="220" width="250" height="142" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="354.0" y="252" font-size="23" font-weight="700" text-anchor="start">metadata.json</text>
      <text x="354.0" y="284" font-size="15.6" font-weight="400" text-anchor="start">Successful typed input/output</text>
      <text x="354.0" y="311" font-size="18" font-weight="400" text-anchor="start">Declared artifact paths</text>
      <rect x="620" y="220" width="250" height="142" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="644.0" y="252" font-size="23" font-weight="700" text-anchor="start">events.jsonl</text>
      <text x="644.0" y="284" font-size="17.5" font-weight="400" text-anchor="start">Replayable progress events</text>
      <text x="644.0" y="311" font-size="18" font-weight="400" text-anchor="start">Execution history</text>
      <rect x="910" y="220" width="250" height="142" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="934.0" y="252" font-size="23" font-weight="700" text-anchor="start">Task artifacts</text>
      <text x="934.0" y="284" font-size="18" font-weight="400" text-anchor="start">Data / model / reports</text>
      <text x="934.0" y="311" font-size="18" font-weight="400" text-anchor="start">Task-relative paths</text>
      <rect x="40" y="408" width="540" height="100" rx="20" fill="#e7f5f1" stroke="#a9d7ca" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="440" font-size="23" font-weight="700" text-anchor="start">Separate log directory</text>
      <text x="64.0" y="472" font-size="18" font-weight="400" text-anchor="start">Read through recorded log_path</text>
      <rect x="620" y="408" width="540" height="100" rx="20" fill="#f0edff" stroke="#d1c6ed" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="644.0" y="440" font-size="23" font-weight="700" text-anchor="start">Environment and raw data</text>
      <text x="644.0" y="472" font-size="18" font-weight="400" text-anchor="start">Plugins / model credentials / market-data paths</text>
      <text x="600.0" y="562" font-size="17" font-weight="400" text-anchor="middle">Task snapshot sync transfers terminal Task directories, not these external dependencies.</text>
    </g>
    <path d="M 44 534 H 1156" fill="none" stroke="#18324b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
