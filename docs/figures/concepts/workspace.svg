<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="764" viewBox="0 0 1280 764" role="img" aria-labelledby="title desc">
  <title id="title">Publish, read and synchronize research evidence</title>
  <desc id="desc">TaskExecutor writes metadata, progress events and published artifacts under the type/Task-ID directory. Research consumers verify successful non-replica upstreams and pin input revisions. TaskIndex and Studio read evidence. Bounded synchronization copies display snapshots to another workspace; replicas cannot be research inputs. Raw data, logs and software require their own preservation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" /></marker></defs>
  <rect x="8" y="8" width="1264" height="748" rx="30" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5" />
  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b" data-diagram-content="true">
    <text x="48" y="51" font-size="31" font-weight="700">Publish, read and synchronize research evidence</text>
    <text x="48" y="83" font-size="18" fill="#52738f">A Task directory is the current execution record; complete upstream artifacts and display replicas serve different readers.</text>
    <text x="48" y="122" font-size="18" font-weight="700" fill="#52738f">Source workspace · &lt;task_type&gt;/&lt;task_id&gt;/</text>
    <rect x="32" y="140" width="1216" height="194" rx="20" fill="#ffffff" stroke="#bdcfdf" stroke-width="1.7" />
    <rect x="48" y="156" width="368" height="160" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="190" font-size="22" font-weight="700">metadata.json</text>
    <text x="72" y="222" font-size="17">Identity · started_at · State · Inputs</text>
    <text x="72" y="248" font-size="17">output_params.artifacts:</text>
    <text x="72" y="274" font-size="17">name → relative path / size / revision</text>
    <rect x="456" y="156" width="368" height="160" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="480" y="190" font-size="22" font-weight="700">Published files</text>
    <text x="480" y="222" font-size="17">Datasets · Model manifests · Scores</text>
    <text x="480" y="248" font-size="17">Backtest tables and reports</text>
    <text x="480" y="274" font-size="17">revision = size:mtime_ns</text>
    <rect x="864" y="156" width="368" height="160" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="888" y="190" font-size="22" font-weight="700">Other Task-owned files</text>
    <text x="888" y="222" font-size="17">events.jsonl: progress journal</text>
    <text x="888" y="248" font-size="17">persistent/: retained across reruns</text>
    <text x="888" y="274" font-size="16.5">Same-name reruns replace current files.</text>
    <path d="M 416 237 L 456 237" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="435" y="223" font-size="15" fill="#52738f" text-anchor="middle">read</text>
    <path d="M 232 334 L 232 398" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 640 334 L 640 398" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 1048 334 L 1048 398" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6" />
    <text x="1068" y="374" font-size="16" fill="#52738f">Bounded copy</text>
    <rect x="48" y="398" width="368" height="174" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="432" font-size="22" font-weight="700">Research consumer</text>
    <text x="72" y="464" font-size="17">Require a successful source Task</text>
    <text x="72" y="490" font-size="17">Verify and pin upstream artifacts</text>
    <text x="72" y="516" font-size="17">Check model / feature compatibility</text>
    <text x="72" y="542" font-size="17">Replicas cannot be input producers.</text>
    <rect x="456" y="398" width="368" height="174" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="480" y="432" font-size="22" font-weight="700">TaskIndex + Studio</text>
    <text x="480" y="464" font-size="17">Read status, logs and input lineage</text>
    <text x="480" y="490" font-size="17">Resolve files from artifact records</text>
    <text x="480" y="516" font-size="17">Research views select succeeded Tasks</text>
    <text x="480" y="542" font-size="17">Observation does not run a Task.</text>
    <rect x="864" y="398" width="368" height="174" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="888" y="432" font-size="22" font-weight="700">Display workspace</text>
    <text x="888" y="464" font-size="17">Terminal Tasks or opt-in live groups</text>
    <text x="888" y="490" font-size="17">Preserve execution identity</text>
    <text x="888" y="516" font-size="17">Report sampling and omitted files</text>
    <text x="888" y="542" font-size="17">Read-only evidence; no process restore</text>
    <rect x="48" y="610" width="1184" height="98" rx="20" fill="#ffffff" stroke="#bdcfdf" stroke-width="1.7" />
    <text x="72" y="645" font-size="22" font-weight="700">Preserve separately for reproduction</text>
    <text x="72" y="678" font-size="17">Raw market data · log_dir text logs · Agent sessions · Plugin source / environment · Service configuration</text>
    <text x="48" y="741" font-size="16" fill="#52738f">Task-relative artifact paths resolve under their producer directory. Parent/child directories remain independent.</text>
  </g>
</svg>
