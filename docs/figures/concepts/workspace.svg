<text text-anchor="middle" x="520" y="92.0" font-size="19" fill="#52677e">Preserve task records, artifacts and environment information for reproducibility.</text><text x="520.0" y="214" text-anchor="middle" font-size="18">Successful input and</text><text x="520.0" y="244" text-anchor="middle" font-size="18">output</text><text x="865.0" y="214" text-anchor="middle" font-size="18">Replayable progress</text><text x="865.0" y="244" text-anchor="middle" font-size="18">events</text><text x="175.0" y="414" text-anchor="middle" font-size="18">Relative to the Task</text><text x="175.0" y="444" text-anchor="middle" font-size="18">directory</text><text x="520.0" y="374" text-anchor="middle" font-size="23" font-weight="600">Separate log</text><text x="520.0" y="411" text-anchor="middle" font-size="23" font-weight="600">directory</text><text x="520.0" y="446" text-anchor="middle" font-size="18">Read via recorded</text><text x="520.0" y="476" text-anchor="middle" font-size="18">log_path</text><text x="865.0" y="374" text-anchor="middle" font-size="21" font-weight="600">Plugin / model</text><text x="865.0" y="411" text-anchor="middle" font-size="21" font-weight="600">environment</text><text x="865.0" y="446" text-anchor="middle" font-size="18">Not bundled in Task</text><text x="865.0" y="476" text-anchor="middle" font-size="18">records</text></g></svg>
