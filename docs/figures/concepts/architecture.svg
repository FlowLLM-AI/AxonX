<text x="44" y="548" font-size="19" fill="#52677e">Plugins contribute Tasks, Components and Jobs; Agent tools use configured Jobs.</text>
<text text-anchor="middle" x="520" y="92.0" font-size="19" fill="#52677e">One Application connects protocols, orchestration, workers and persistent records.</text><text x="175.0" y="414" text-anchor="middle" font-size="18">Launch and supervise</text><text x="175.0" y="444" text-anchor="middle" font-size="18">workers</text><text x="865.0" y="374" text-anchor="middle" font-size="23" font-weight="600">Workspace /</text><text x="865.0" y="411" text-anchor="middle" font-size="23" font-weight="600">Repository</text><text x="865.0" y="446" text-anchor="middle" font-size="18">status / metadata /</text><text x="865.0" y="476" text-anchor="middle" font-size="18">events</text></g></svg>
