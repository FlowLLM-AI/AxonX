<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="774" viewBox="0 0 1256 774" role="img" aria-labelledby="title desc">
  <title id="title">AxonX framework: calls, execution, and evidence</title>
  <desc id="desc">Jobs orchestrate capabilities; plugin Tasks run research; records make results inspectable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1240.0" height="758.0" rx="30" fill="#f5f8fc" stroke="#18324b" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b">
      <text x="44" y="48" font-size="32" font-weight="700" text-anchor="start">AxonX framework: calls, execution, and evidence</text>
      <text x="44" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Jobs orchestrate capabilities; plugin Tasks run research; records make results inspectable.</text>
      <rect x="40" y="116" width="1120" height="94" rx="18.8" fill="#ffffff" stroke="#ccd9e5" stroke-width="1.6" stroke-linecap="round" />
      <text x="64.0" y="148" font-size="23" font-weight="700" text-anchor="start">Clients and Agent access</text>
      <text x="64.0" y="180" font-size="18" font-weight="400" text-anchor="start">CLI / external MCP · Studio HTTP / SSE · Built-in Agent Job bridge</text>
      <path d="M 600 210 V 240" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="40" y="240" width="1120" height="94" rx="18.8" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.6" stroke-linecap="round" />
      <text x="64.0" y="272" font-size="23" font-weight="700" text-anchor="start">Dispatcher → Job → asynchronous Steps</text>
      <text x="64.0" y="304" font-size="18" font-weight="400" text-anchor="start">Validate inputs · Use Components · Return JobResponse or HTTP events</text>
      <path d="M 260 334 V 373" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 820 334 V 373" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="40" y="374" width="440" height="120" rx="20" fill="#e7f5f1" stroke="#a9d7ca" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="406" font-size="23" font-weight="700" text-anchor="start">TaskManager → Task worker</text>
      <text x="64.0" y="438" font-size="18" font-weight="400" text-anchor="start">Submit typed input · Supervise subprocess</text>
      <text x="64.0" y="465" font-size="18" font-weight="400" text-anchor="start">Run synchronous research steps</text>
      <rect x="560" y="374" width="600" height="120" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="584.0" y="406" font-size="23" font-weight="700" text-anchor="start">Components / TaskRepository</text>
      <text x="584.0" y="438" font-size="18" font-weight="400" text-anchor="start">Query status, logs, artifacts, and lineage</text>
      <text x="584.0" y="465" font-size="18" font-weight="400" text-anchor="start">Agent, clients, proxy, and other capabilities</text>
      <path d="M 260 494 V 526" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 860 494 V 526" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="40" y="526" width="1120" height="94" rx="18.8" fill="#ffffff" stroke="#ccd9e5" stroke-width="1.6" stroke-linecap="round" />
      <text x="64.0" y="558" font-size="23" font-weight="700" text-anchor="start">Workspace records + separate logs</text>
      <text x="64.0" y="590" font-size="18" font-weight="400" text-anchor="start">status.json · metadata.json · events.jsonl · Research artifacts · Recorded log_path</text>
      <text x="600.0" y="670.0" font-size="17" font-weight="400" text-anchor="middle">Plugins contribute Tasks, Jobs, and Components; each target owns its environment and records.</text>
      <text x="600.0" y="696.0" font-size="17" font-weight="400" text-anchor="middle">Solid arrows: call / execution / write. Dashed arrows: query / read.</text>
    </g>
    <path d="M 44 642 H 1156" fill="none" stroke="#18324b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
