<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
<title id="title">Execution owners and shared Task evidence</title>
<desc id="desc">Local exec, service-owned CLI commands and daemon-owned schedules use the synchronous TaskExecutor.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#52738f" stroke-width="1.6"/></marker></defs>
<rect x="8" y="8" width="1304" height="634" rx="24" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#18324b" data-diagram-content="true">
<text x="40" y="53" font-size="28" font-weight="700">Execution owners and shared Task evidence</text>
<text x="40" y="84" font-size="17" fill="#52738f">Local exec, service-owned CLI commands and daemon-owned schedules use the synchronous TaskExecutor.</text>
<rect x="40" y="119" width="390" height="156" rx="16" fill="#e8f1ff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="60" y="153" font-size="22" font-weight="700">Local CLI exec</text>
<text x="60" y="189" font-size="18">Runs in the caller process.</text>
<text x="60" y="216" font-size="18">Resolves service execution defaults.</text>
<text x="60" y="243" font-size="18">Waits; returns business output.</text>
<rect x="465" y="119" width="390" height="156" rx="16" fill="#f0edff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="485" y="153" font-size="22" font-weight="700">Remote cli Job</text>
<text x="485" y="189" font-size="18">Service owns a child process group.</text>
<text x="485" y="216" font-size="18">Streams command stdout / stderr.</text>
<text x="485" y="243" font-size="18">Cancellation can stop the group.</text>
<rect x="890" y="119" width="390" height="156" rx="16" fill="#fff1dd" stroke="#b8cadb" stroke-width="1.5"/>
<text x="910" y="153" font-size="22" font-weight="700">Cron → daemon exec</text>
<text x="910" y="189" font-size="18">Service computes future triggers.</text>
<text x="910" y="216" font-size="18">Daemon owns scheduled processes.</text>
<text x="910" y="243" font-size="18">They survive service replacement.</text>
<path d="M 235 275 V 313" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 660 275 V 313" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1085 275 V 313" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="315" width="1240" height="117" rx="16" fill="#e7f5f1" stroke="#b8cadb" stroke-width="1.5"/>
<text x="60" y="349" font-size="22" font-weight="700">TaskExecutor</text>
<text x="60" y="385" font-size="18">Installed Task catalog → synchronous steps and children → resource cleanup → typed output and terminal metadata</text>
<text x="60" y="412" font-size="18">Plugins register Tasks. Callers coordinate concurrent writes to a fixed Task name.</text>
<path d="M 340 432 V 480" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="482" width="600" height="111" rx="16" fill="#e8f1ff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="60" y="516" font-size="22" font-weight="700">Workspace records</text>
<text x="60" y="552" font-size="18">metadata.json · events.jsonl · artifacts · persistent/</text>
<rect x="700" y="482" width="580" height="111" rx="16" fill="#f0edff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="720" y="516" font-size="22" font-weight="700">Observation Jobs and Studio</text>
<text x="720" y="552" font-size="18">Lists and graphs use the index; status reads fresh records.</text>
<path d="M 640 538 H 698" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="626" font-size="17">Task identity: task_id + started_at. Service shutdown stops manual commands; scheduled commands have separate ownership.</text>
</g>
</svg>
