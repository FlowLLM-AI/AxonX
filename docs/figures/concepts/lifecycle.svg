<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="380" viewBox="0 0 1320 380" role="img" aria-labelledby="title desc">
<title id="title">Current Task lifecycle</title>
<desc id="desc">Preparation precedes running; terminal states are succeeded or failed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526176" stroke-width="1.7"/></marker></defs>
<rect x="8" y="8" width="1304" height="364" rx="22" fill="#faf9f5" stroke="#364152" stroke-width="2"/>
<g font-family="Comic Sans MS, Chalkboard SE, Comic Neue, cursive" fill="#243349">
<text x="36" y="51" font-size="28">Current Task lifecycle</text>
<rect x="36.0" y="91" width="295.5" height="205" rx="16" fill="#e8f2f4" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="53.0" y="125" font-size="21" font-weight="bold">Prepare directory</text>
<text x="53.0" y="167" font-size="16">Reject active or unverified</text>
<text x="53.0" y="191" font-size="16">ownership; preserve</text>
<text x="53.0" y="215" font-size="16">persistent data on rerun.</text>
<path d="M334.5 193 H349.5" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="353.5" y="91" width="295.5" height="205" rx="16" fill="#f1ebf8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="370.5" y="125" font-size="21" font-weight="bold">Running</text>
<text x="370.5" y="167" font-size="16">Record process identity,</text>
<text x="370.5" y="191" font-size="16">started_at, steps and partial</text>
<text x="370.5" y="215" font-size="16">outputs.</text>
<path d="M652.0 193 H667.0" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="671.0" y="91" width="295.5" height="205" rx="16" fill="#eaf3e8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="688.0" y="125" font-size="21" font-weight="bold">Close resources</text>
<text x="688.0" y="167" font-size="16">Complete cleanup before</text>
<text x="688.0" y="191" font-size="16">validating final typed</text>
<text x="688.0" y="215" font-size="16">output.</text>
<path d="M969.5 193 H984.5" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="988.5" y="91" width="295.5" height="205" rx="16" fill="#fff0dd" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="1005.5" y="125" font-size="21" font-weight="bold">Terminal result</text>
<text x="1005.5" y="167" font-size="16">Exit 0: succeeded. Exception</text>
<text x="1005.5" y="191" font-size="16">or nonzero outcome: failed.</text>
<text x="36" y="329" font-size="16">Explicit same-name reruns replace the current record and advance started_at. Observation never repairs stale process state.</text>
</g></svg>
