<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="536" viewBox="0 0 1136 536" role="img" aria-labelledby="title desc">
  <title id="title">Studio Navigation</title>
  <desc id="desc">Move from submission to runtime inspection and research evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1120.0" height="520.0" rx="30" fill="#f7f9fc" stroke="#172c49" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#172c49">
      <text x="44" y="54" font-size="32" font-weight="700" text-anchor="start">Studio Navigation</text>
      <text x="44" y="86" font-size="18" fill="#172c49" text-anchor="start">Move from submission to runtime inspection and research evidence.</text>
      <path d="M260 197H294" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M518 197H552" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M776 197H810" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M410 255V267" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M668 255V267" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="44" y="143" width="216" height="108" rx="20" fill="#e6f1ff" stroke="#b8c8df" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="62" y="176" font-size="23" font-weight="700">Submit</text>
      <text x="62" y="205" font-size="18">Task Schema form</text>
      <rect x="302" y="143" width="216" height="108" rx="20" fill="#e2f4f0" stroke="#b8c8df" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="320" y="176" font-size="23" font-weight="700">Runtime</text>
      <text x="320" y="205" font-size="18">Status / logs / graph</text>
      <rect x="560" y="143" width="216" height="108" rx="20" fill="#e6f1ff" stroke="#b8c8df" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="578" y="176" font-size="23" font-weight="700">Research</text>
      <text x="578" y="205" font-size="18">Metadata / charts</text>
      <rect x="818" y="143" width="216" height="108" rx="20" fill="#e2f4f0" stroke="#b8c8df" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="836" y="176" font-size="23" font-weight="700">Compare</text>
      <text x="836" y="205" font-size="18">
        <tspan x="836" dy="0">Common-window</tspan>
        <tspan x="836" dy="28">metrics</tspan>
      </text>
      <rect x="302" y="275" width="216" height="108" rx="20" fill="#eef2fa" stroke="#b8c8df" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="320" y="308" font-size="23" font-weight="700">Resources</text>
      <text x="320" y="337" font-size="18">CPU / memory / GPU</text>
      <rect x="560" y="275" width="216" height="108" rx="20" fill="#e2f4f0" stroke="#b8c8df" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="578" y="308" font-size="23" font-weight="700">Agent</text>
      <text x="578" y="337" font-size="18">
        <tspan x="578" dy="0">Task-grounded</tspan>
        <tspan x="578" dy="28">analysis</tspan>
      </text>
      <rect x="44" y="391" width="992" height="48" rx="12" fill="#e9eff8" />
      <text x="64" y="422" font-size="18" text-anchor="start">The browser calls its local backend. Remote target credentials stay in server configuration.</text>
