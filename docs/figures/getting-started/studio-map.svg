<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="650" viewBox="0 0 1136 650" role="img" aria-labelledby="title desc">
<title id="title">Studio: research prompt to experiment evidence</title>
<desc id="desc">A research prompt and AxonX Skill guide an Agent with source tools to develop a plugin. Install it in the selected service, verify schemas, submit Tasks and inspect evidence in Studio. Source changes, installation and submission are separate. Factor analysis branches from ETL independently of training.</desc>
