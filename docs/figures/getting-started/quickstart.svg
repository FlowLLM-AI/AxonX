<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="400" viewBox="0 0 1320 400" role="img" aria-labelledby="title desc">
<title id="title">Your first Task: execute, then inspect</title>
<desc id="desc">The demo runs synchronously; metadata identifies the current execution.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#52738f" stroke-width="1.6"/></marker></defs>
<rect x="8" y="8" width="1304" height="384" rx="24" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#18324b" data-diagram-content="true">
<text x="40" y="53" font-size="28" font-weight="700">Your first Task: execute, then inspect</text>
<text x="40" y="84" font-size="17" fill="#52738f">The demo runs synchronously; metadata identifies the current execution.</text>
<rect x="40" y="116" width="286" height="176" rx="16" fill="#e8f1ff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="60" y="150" font-size="22" font-weight="700">1. Start service</text>
<text x="60" y="186" font-size="18">Set a service token.</text>
<text x="60" y="213" font-size="18">Start axonx app.</text>
<text x="60" y="240" font-size="18">Open a second terminal.</text>
<path d="M 327 204 H 356" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="358" y="116" width="286" height="176" rx="16" fill="#f0edff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="378" y="150" font-size="22" font-weight="700">2. Execute Demo</text>
<text x="378" y="186" font-size="18">exec --task demo</text>
<text x="378" y="213" font-size="18">--task-name quickstart</text>
<text x="378" y="240" font-size="18">--x 1 --y 2</text>
<path d="M 645 204 H 674" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="676" y="116" width="286" height="176" rx="16" fill="#e7f5f1" stroke="#b8cadb" stroke-width="1.5"/>
<text x="696" y="150" font-size="22" font-weight="700">3. Check outcome</text>
<text x="696" y="186" font-size="18">exec waits for completion.</text>
<text x="696" y="213" font-size="18">Read result = 3</text>
<text x="696" y="240" font-size="18">and process exit code 0.</text>
<path d="M 963 204 H 992" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="994" y="116" width="286" height="176" rx="16" fill="#fff1dd" stroke="#b8cadb" stroke-width="1.5"/>
<text x="1014" y="150" font-size="22" font-weight="700">4. Inspect record</text>
<text x="1014" y="186" font-size="18">status --detail full</text>
<text x="1014" y="213" font-size="18">task_id + started_at</text>
<text x="1014" y="240" font-size="18">Steps, logs and output.</text>
<text x="40" y="332" font-size="17">Demo ID: base#demo#quickstart. Use another instance name to preserve an independent result.</text>
<text x="40" y="359" font-size="17">wait_task observes the current execution and rejects a changed started_at during its wait.</text>
</g>
</svg>
