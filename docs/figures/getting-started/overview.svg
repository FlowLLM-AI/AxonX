    <text x="52" y="84" font-size="20" font-weight="400" text-anchor="start" fill="#52738f">Agent-native quantitative research harness</text>
    <text x="1228" y="60.0" font-size="18" font-weight="400" text-anchor="end" fill="#52738f">Prompt → Code → Experiments</text>
    <rect x="52" y="101" width="560" height="73" rx="20" fill="#f0edff" stroke="#d1c6ed" stroke-width="1.8" stroke-dasharray="8 6" />
    <text x="80" y="129" font-size="22" font-weight="700">Research prompt + AxonX Skill</text>
    <text x="80" y="154" font-size="17" fill="#52738f">Source + file / command tools</text>
    <path d="M 332 174 V 201" fill="none" stroke="#52738f" stroke-width="2" marker-end="url(#arrow)" />
    <g transform="translate(0 100)">
    <rect x="52" y="101.0" width="560" height="73.2" rx="20" fill="#ffffff" stroke="#ccd9e5" stroke-width="1.8" stroke-dasharray="8 6" />
    <text x="80" y="132" font-size="23" font-weight="700" text-anchor="start" fill="#18324b">External / Built-in Agents</text>
    <text x="80" y="158" font-size="17" font-weight="400" text-anchor="start" fill="#52738f">CLI / MCP / built-in Job tools</text>
    <rect x="668" y="1" width="560" height="173.2" rx="20" fill="#ffffff" stroke="#ccd9e5" stroke-width="1.8" stroke-dasharray="8 6" />
    <text x="696" y="36" font-size="27" font-weight="700" text-anchor="start" fill="#18324b">AxonX Studio</text>
    <text x="1200" y="36" font-size="20" font-weight="400" text-anchor="end" fill="#52738f">HTTP / SSE</text>
    <text x="696" y="70" font-size="18" fill="#52738f">Built-in Agent sessions</text>
    <text x="696" y="100" font-size="18" fill="#18324b">Task control · Logs · Lineage</text>
    <text x="696" y="130" font-size="18" fill="#18324b">Factors · Training curves · Predictions</text>
    <text x="696" y="158" font-size="18" fill="#18324b">Backtests · Strategy comparisons</text>
    <path d="M 332 174.1 V 203.4" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 948 174.1 V 203.4" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="52" y="203.4" width="1176" height="82.0" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.8" stroke-dasharray="8 6" />
    <text x="640" y="232.7" font-size="27" font-weight="700" text-anchor="middle" fill="#18324b">Shared Job interfaces</text>
    <text x="170" y="262.7" font-size="19" font-weight="400" text-anchor="middle" fill="#18324b">Discover</text>
    <path d="M 287 250.2 v 16.8" fill="none" stroke="#c0d3ec" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
