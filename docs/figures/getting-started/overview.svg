    <text x="1060.0" y="123.0" font-size="18" font-weight="400" fill="#18324b" text-anchor="middle">HTTP / SSE</text>
    <path d="M 310 152 V 183" fill="none" stroke="#52738f" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 890 152 V 183" fill="none" stroke="#52738f" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="40" y="184" width="1120" height="102" rx="16" fill="#e8f1ff" stroke="#a9c5e8" />
    <text x="600" y="216" font-size="23" font-weight="700" fill="#18324b" text-anchor="middle">Shared Job interfaces</text>
