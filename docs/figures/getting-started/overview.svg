<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">AxonX · Agent-native Quantitative Research Harness</title>
  <desc id="desc">A research prompt, AxonX Skill, and source tools guide external or built-in Agents to develop plugin code. Local CLI exec calls the TaskExecutor directly. Studio, remote CLI, MCP, and built-in Job tools use service Jobs; the cli Job starts a service-owned CLI subprocess for exec, kill, and plugin commands. Plugins define typed research Tasks, and the synchronous executor runs steps and child Tasks while writing status, progress, and logs. TaskIndex observes target-local workspace records; kill is an independent CLI command. The workspace stores records, artifact references, and lineage, with log references pointing to the configured log directory. Solid arrows show calls and recording; dashed arrows show plugin development and evidence queries.</desc>
