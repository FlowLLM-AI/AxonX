    <rect x="40" y="82" width="540" height="70" rx="12" fill="#ffffff" stroke="#ccd9e5" />
    <text x="64" y="126" font-size="24" font-weight="700" fill="#18324b" text-anchor="start">Agents</text>
    <rect x="404" y="99" width="152" height="36" rx="8" fill="#f0f6ff" stroke="#c9daef" />
    <text x="480.0" y="123.0" font-size="18" font-weight="400" fill="#18324b" text-anchor="middle">CLI / MCP</text>
