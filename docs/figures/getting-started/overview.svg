<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">AxonX · Agent-native Quantitative Research Harness</title>
  <desc id="desc">Agents use CLI or MCP; AxonX Studio uses HTTP and SSE. Both access shared Job interfaces. In the selected local or remote target, plugins define Tasks, independent workers execute them, and the workspace keeps records, artifacts and upstream task lineage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect width="1200" height="610" rx="24" fill="#f5f8fc" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#18324b">
