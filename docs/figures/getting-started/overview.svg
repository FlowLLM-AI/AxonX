<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="852" viewBox="0 0 1280 852" role="img" aria-labelledby="title desc">
  <title id="title">AxonX</title>
  <desc id="desc">Three layers: Agents with Skill and tools or Studio; direct CLI commands and Job services; six core capabilities. A service cli Job launches a command process. Task runtime executes research; application components query and manage evidence. Core cards are capabilities, not sequential stages.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" /></marker></defs>
  <rect x="8" y="8" width="1264" height="836" rx="30" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5" />
  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b" data-diagram-content="true">
    <text x="48" y="51" font-size="31" font-weight="700">AxonX</text>
    <text x="48" y="83" font-size="18" fill="#52738f">Agent-native quantitative research harness · Prompt → Code → Experiments</text>
    <text x="48" y="123" font-size="18" font-weight="700" fill="#52738f">01  Research interfaces</text>
    <rect x="48" y="140" width="552" height="120" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="174" font-size="22" font-weight="700">Agents + AxonX Skill</text>
    <text x="72" y="206" font-size="17">Research prompt · Source + file tools</text>
    <text x="72" y="232" font-size="17">External CLI / MCP · Built-in CLI / Job tools</text>
    <rect x="680" y="140" width="552" height="120" rx="20" fill="#ffffff" stroke="#bdcfdf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="704" y="174" font-size="22" font-weight="700">AxonX Studio</text>
    <text x="704" y="206" font-size="17">Agent sessions · Task control · Logs · Lineage</text>
    <text x="704" y="232" font-size="17">Factors · Models · Predictions · Backtests · Comparisons</text>
    <text x="48" y="302" font-size="18" font-weight="700" fill="#52738f">02  Commands &amp; services</text>
    <rect x="48" y="320" width="552" height="120" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="354" font-size="22" font-weight="700">CLI commands</text>
    <text x="72" y="386" font-size="17">exec · kill · plugin</text>
    <text x="72" y="412" font-size="17">Run locally or through a service-owned child</text>
    <rect x="680" y="320" width="552" height="120" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="704" y="354" font-size="22" font-weight="700">Job service · HTTP / SSE / MCP</text>
    <text x="704" y="386" font-size="17">Discover schemas · Query status / logs / results</text>
    <text x="704" y="412" font-size="17">Sessions · Workspace · Machine operations</text>
    <path d="M 324 260 L 324 320" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 576 260 L 740 320" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 956 260 L 956 320" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 680 397 L 600 397" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="640" y="383" font-size="15" fill="#52738f" text-anchor="middle">cli Job</text>
    <text x="48" y="482" font-size="18" font-weight="700" fill="#52738f">03  AxonX core</text>
    <rect x="32" y="500" width="1216" height="306" rx="20" fill="#ffffff" stroke="#bdcfdf" stroke-width="1.7" />
    <rect x="48" y="516" width="384" height="128" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="550" font-size="22" font-weight="700">Task definitions</text>
    <text x="72" y="582" font-size="17">Typed inputs / outputs · Research bases</text>
    <text x="72" y="608" font-size="17">Steps · Child Tasks · Built-in Tasks</text>
    <rect x="448" y="516" width="384" height="128" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="472" y="550" font-size="22" font-weight="700">Task runtime</text>
    <text x="472" y="582" font-size="17">Catalog · Synchronous executor</text>
    <text x="472" y="608" font-size="17">Lifecycle · Progress · Process control</text>
    <rect x="848" y="516" width="384" height="128" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="872" y="550" font-size="22" font-weight="700">Application components</text>
    <text x="872" y="582" font-size="17">Config · Providers · Jobs · Agent</text>
    <text x="872" y="608" font-size="17">TaskIndex · Machine · Sync · Proxy</text>
    <rect x="48" y="660" width="384" height="128" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="694" font-size="22" font-weight="700">Evidence &amp; artifacts</text>
    <text x="72" y="726" font-size="17">Metadata · Parameters · Logs · Files</text>
    <text x="72" y="752" font-size="17">Source revisions · Recorded lineage</text>
    <rect x="448" y="660" width="384" height="128" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="472" y="694" font-size="22" font-weight="700">Plugin system</text>
    <text x="472" y="726" font-size="17">Task registration · Discovery</text>
    <text x="472" y="752" font-size="17">Wheel build · Install · Fingerprints</text>
    <rect x="848" y="660" width="384" height="128" rx="20" fill="#fff2df" stroke="#dfc89e" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="872" y="694" font-size="22" font-weight="700">Daemon &amp; scheduling</text>
    <text x="872" y="726" font-size="17">Supervise service · Restart · Update</text>
    <text x="872" y="752" font-size="17">App Cron → daemon-owned exec</text>
    <path d="M 528 440 L 528 516" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="546" y="467" font-size="15" fill="#52738f">exec / kill</text>
    <path d="M 1056 440 L 1056 516" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="1074" y="467" font-size="15" fill="#52738f">Query / manage</text>
    <text x="48" y="831" font-size="16" fill="#52738f">Each execution target owns its installed code, data, processes and research evidence.</text>
  </g>
</svg>
