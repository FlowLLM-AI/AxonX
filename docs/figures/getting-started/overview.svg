    <rect x="454" y="473" width="138" height="32" rx="8" fill="#ffffff" stroke="#b6dacd" />
    <text x="523.0" y="495.0" font-size="16" font-weight="400" fill="#18324b" text-anchor="middle">Status</text>
    <rect x="608" y="473" width="138" height="32" rx="8" fill="#ffffff" stroke="#b6dacd" />
    <text x="677.0" y="495.0" font-size="16" font-weight="400" fill="#18324b" text-anchor="middle">Progress</text>
    <rect x="454" y="513" width="138" height="32" rx="8" fill="#ffffff" stroke="#b6dacd" />
    <text x="523.0" y="535.0" font-size="16" font-weight="400" fill="#18324b" text-anchor="middle">Wait</text>
    <rect x="608" y="513" width="138" height="32" rx="8" fill="#ffffff" stroke="#b6dacd" />
