<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">AxonX · Agent-native Quantitative Research Harness</title>
  <desc id="desc">A research prompt, AxonX Skill, and source tools guide external or built-in Agents to develop plugin code. Agents use CLI, MCP, or built-in Job tools; Studio provides built-in Agent sessions, Task control, logs, lineage, factor and model analysis, predictions, backtests, and strategy comparisons, using HTTP and SSE to call shared Jobs. In the selected local or remote target, plugins define typed research Tasks, workers execute them, and the workspace preserves research records, artifacts, and lineage. Solid arrows show execution and recording; dashed arrows show plugin development and evidence queries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="5.9" width="1264" height="668.3" rx="30" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5" />
  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b" data-diagram-content="true">
