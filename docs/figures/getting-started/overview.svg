    <text x="492" y="485" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Status · Progress</text>
    <text x="492" y="517" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Wait · Cancel</text>
    <rect x="880" y="372" width="344" height="176" rx="20" fill="#edf3fc" stroke="#bbcee5" stroke-width="1.8" stroke-dasharray="8 6" />
    <text x="904" y="406" font-size="25" font-weight="700" text-anchor="start" fill="#18324b">Shared workspace</text>
    <path d="M 904 421 H 1200" fill="none" stroke="#bbcee5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="904" y="453" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Records · Parameters</text>
    <text x="904" y="485" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Logs &amp; artifacts</text>
    <text x="904" y="517" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Task graph · Upstream IDs</text>
    <path d="M 400 469 H 468" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="434" y="459.5" font-size="15" font-weight="400" text-anchor="middle" fill="#52738f">Define</text>
    <path d="M 812 469 H 880" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="846" y="459.5" font-size="15" font-weight="400" text-anchor="middle" fill="#52738f">Record</text>
    </g>
    <path d="M 52 237 H 22 V 544 H 56" fill="none" stroke="#52738f" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" />
