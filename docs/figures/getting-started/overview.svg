    <rect x="844" y="433" width="292" height="32" rx="8" fill="#ffffff" stroke="#c7d6eb" />
    <text x="990.0" y="455.0" font-size="17" font-weight="400" fill="#18324b" text-anchor="middle">Task records &amp; parameters</text>
    <rect x="844" y="473" width="292" height="32" rx="8" fill="#ffffff" stroke="#c7d6eb" />
    <text x="990.0" y="495.0" font-size="17" font-weight="400" fill="#18324b" text-anchor="middle">Logs &amp; artifacts</text>
    <rect x="844" y="513" width="292" height="32" rx="8" fill="#ffffff" stroke="#c7d6eb" />
    <text x="990.0" y="535.0" font-size="17" font-weight="400" fill="#18324b" text-anchor="middle">Task Graph · Upstream IDs</text>
