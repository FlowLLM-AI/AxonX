<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Configuration resolution and precedence">
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect width="1000" height="310" rx="20" fill="#f4f8fc" />
  <g font-family="Comic Sans MS, Bradley Hand, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#173653">
    <text x="500.0" y="52" font-size="28" font-weight="700" text-anchor="middle">Configuration resolution and precedence</text>
    <rect x="50.0" y="100" width="198.75" height="110" rx="14" fill="#e4edfc" stroke="#88b2cc" />
    <text x="149.375" y="137" text-anchor="middle" font-size="20">Parent configs</text>
    <text x="149.375" y="169" text-anchor="middle" font-size="20">extends order</text>
    <path d="M252.75 155H278.75" stroke="#247baf" stroke-width="1.45" marker-end="url(#arrow)" stroke-linecap="round" fill="none" stroke-linejoin="round" />
    <rect x="283.75" y="100" width="198.75" height="110" rx="14" fill="#e2f3f0" stroke="#88b2cc" />
    <text x="383.125" y="137" text-anchor="middle" font-size="20">Current file</text>
    <text x="383.125" y="169" text-anchor="middle" font-size="20">Deep merge</text>
    <path d="M486.5 155H512.5" stroke="#247baf" stroke-width="1.45" marker-end="url(#arrow)" stroke-linecap="round" fill="none" stroke-linejoin="round" />
    <rect x="517.5" y="100" width="198.75" height="110" rx="14" fill="#e4edfc" stroke="#88b2cc" />
    <text x="616.875" y="137" text-anchor="middle" font-size="20">Explicit overrides</text>
    <text x="616.875" y="169" text-anchor="middle" font-size="20">CLI / Python</text>
    <path d="M720.25 155H746.25" stroke="#247baf" stroke-width="1.45" marker-end="url(#arrow)" stroke-linecap="round" fill="none" stroke-linejoin="round" />
    <rect x="751.25" y="100" width="198.75" height="110" rx="14" fill="#e2f3f0" stroke="#88b2cc" />
    <text x="850.625" y="137" text-anchor="middle" font-size="20">Validation</text>
    <text x="850.625" y="169" text-anchor="middle" font-size="20">ApplicationConfig</text>
    <text x="50" y="253" font-size="19">Mappings merge recursively; lists are replaced as a whole.</text>
    <text x="50" y="282" font-size="19">Environment placeholders are resolved within each configuration file.</text>
