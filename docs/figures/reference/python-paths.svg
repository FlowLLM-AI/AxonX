      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect width="1000" height="390" rx="20" fill="#f4f8fc" />
  <g font-family="Comic Sans MS, Bradley Hand, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#173653">
    <text x="500.0" y="50" font-size="28" font-weight="700" text-anchor="middle">Python: embedded application and remote clients</text>
    <rect x="50" y="95" width="235" height="90" rx="14" fill="#e4edfc" stroke="#88b2cc" />
    <text x="167.5" y="129" text-anchor="middle" font-size="20">Application</text>
