    <path d="M630 265H690" fill="none" stroke="#247baf" stroke-width="1.45" marker-end="url(#a)" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="695" y="220" width="255" height="90" rx="14" fill="#e4edfc" stroke="#88b2cc" />
    <text x="822.5" y="254" text-anchor="middle" font-size="20">JobResponse</text>
    <text x="822.5" y="282" text-anchor="middle" font-size="20">HTTP SSE events</text>
    <text x="50" y="355" font-size="19">Both paths require lifecycle management and explicit connection configuration.</text>
