    <text x="497.5" y="129" text-anchor="middle" font-size="20">Dispatcher</text>
    <text x="497.5" y="157" text-anchor="middle" font-size="20">Local Job → Step</text>
    <path d="M630 140H690" fill="none" stroke="#247baf" stroke-width="1.45" marker-end="url(#a)" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="695" y="95" width="255" height="90" rx="14" fill="#e4edfc" stroke="#88b2cc" />
    <text x="822.5" y="129" text-anchor="middle" font-size="20">JobResponse</text>
    <text x="822.5" y="157" text-anchor="middle" font-size="20">or typed events</text>
    <rect x="50" y="220" width="235" height="90" rx="14" fill="#e4edfc" stroke="#88b2cc" />
    <text x="167.5" y="254" text-anchor="middle" font-size="20">HTTP / MCP</text>
    <text x="167.5" y="282" text-anchor="middle" font-size="20">Remote client</text>
    <path d="M290 265H365" fill="none" stroke="#247baf" stroke-width="1.45" marker-end="url(#a)" stroke-linecap="round" stroke-linejoin="round" />
