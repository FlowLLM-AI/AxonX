<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="451" viewBox="0 0 1056 451" role="img" aria-labelledby="title desc" aria-label="Python: embedded application and remote clients">
  <title id="title">Python: embedded application and remote clients</title>
  <desc id="desc">Embedded applications manage a local Dispatcher; remote clients connect to a service with its own workspace.</desc>
  <defs>
    <marker id="a" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1040.0" height="435.0" rx="30" fill="#f4f8fc" stroke="#173653" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#173653">
      <text x="44" y="50" font-size="32" font-weight="700" text-anchor="start">Python: embedded application and remote clients</text>
      <rect x="50" y="95" width="235" height="90" rx="18.0" fill="#e4edfc" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="167.5" y="129" text-anchor="middle" font-size="20">Application</text>
      <text x="167.5" y="157" text-anchor="middle" font-size="20">Local lifecycle</text>
      <path d="M290 140H365" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#a)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="370" y="95" width="255" height="90" rx="18.0" fill="#e2f3f0" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="394.0" y="129" text-anchor="start" font-size="20">Dispatcher</text>
      <text x="394.0" y="157" text-anchor="start" font-size="20">Local Job → Step</text>
      <path d="M630 140H690" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#a)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="695" y="95" width="255" height="90" rx="18.0" fill="#e4edfc" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="719.0" y="129" text-anchor="start" font-size="20">JobResponse</text>
      <text x="719.0" y="157" text-anchor="start" font-size="20">or typed events</text>
      <rect x="50" y="220" width="235" height="90" rx="18.0" fill="#e4edfc" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="167.5" y="254" text-anchor="middle" font-size="20">HTTP / MCP</text>
      <text x="167.5" y="282" text-anchor="middle" font-size="20">Remote client</text>
      <path d="M290 265H365" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#a)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="370" y="220" width="255" height="90" rx="18.0" fill="#e2f3f0" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="394.0" y="254" text-anchor="start" font-size="20">Remote service</text>
      <text x="394.0" y="282" text-anchor="start" font-size="20">Server workspace</text>
      <path d="M630 265H690" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#a)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="695" y="220" width="255" height="90" rx="18.0" fill="#e4edfc" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="719.0" y="254" text-anchor="start" font-size="20">JobResponse</text>
      <text x="719.0" y="282" text-anchor="start" font-size="20">HTTP SSE events</text>
      <text x="500.0" y="360.0" font-size="19" text-anchor="middle">Both paths require lifecycle management and explicit connection configuration.</text>
    </g>
    <path d="M 44 332 H 956" fill="none" stroke="#173653" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
