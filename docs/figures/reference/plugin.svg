<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="400" viewBox="0 0 1320 400" role="img" aria-labelledby="title desc">
<title id="title">From a distribution to registered Tasks</title>
<desc id="desc">Discover metadata first; resolve Task classes and their schemas when requested.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#52738f" stroke-width="1.6"/></marker></defs>
<rect x="8" y="8" width="1304" height="384" rx="24" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#18324b" data-diagram-content="true">
<text x="40" y="53" font-size="28" font-weight="700">From a distribution to registered Tasks</text>
<text x="40" y="84" font-size="17" fill="#52738f">Discover metadata first; resolve Task classes and their schemas when requested.</text>
<rect x="40" y="116" width="286" height="176" rx="16" fill="#e8f1ff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="60" y="150" font-size="22" font-weight="700">Distribution</text>
<text x="60" y="186" font-size="18">Install into the intended</text>
<text x="60" y="213" font-size="18">Python interpreter.</text>
<text x="60" y="240" font-size="18">Keep dependency versions.</text>
<path d="M 327 204 H 356" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="358" y="116" width="286" height="176" rx="16" fill="#f0edff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="378" y="150" font-size="22" font-weight="700">Entry point</text>
<text x="378" y="186" font-size="18">Group: axonx.plugins</text>
<text x="378" y="213" font-size="18">Name → Python package</text>
<text x="378" y="240" font-size="18">containing plugin.yaml.</text>
<path d="M 645 204 H 674" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="676" y="116" width="286" height="176" rx="16" fill="#e7f5f1" stroke="#b8cadb" stroke-width="1.5"/>
<text x="696" y="150" font-size="22" font-weight="700">Task manifest</text>
<text x="696" y="186" font-size="18">tasks: registration →</text>
<text x="696" y="213" font-size="18">module:TaskClass</text>
<text x="696" y="240" font-size="18">Only Task registrations.</text>
<path d="M 963 204 H 992" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="994" y="116" width="286" height="176" rx="16" fill="#fff1dd" stroke="#b8cadb" stroke-width="1.5"/>
<text x="1014" y="150" font-size="22" font-weight="700">TaskCatalog</text>
<text x="1014" y="186" font-size="18">Snapshot registrations.</text>
<text x="1014" y="213" font-size="18">Import classes lazily.</text>
<text x="1014" y="240" font-size="18">Cache resolved classes.</text>
<text x="40" y="332" font-size="17">New CLI processes discover installed plugins. Restart persistent services after registration or loaded-code changes.</text>
<text x="40" y="359" font-size="17">Framework providers use Application(providers=...) and configuration; Task manifests do not register Jobs or Components.</text>
</g>
</svg>
