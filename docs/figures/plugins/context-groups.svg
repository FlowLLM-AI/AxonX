<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Alpha158 context feature groups</title>
  <desc id="desc">158 original features plus 11 market, 6 liquidity, 5 relative, and 4 interaction features give 184 features. Training selects groups; prediction follows saved model metadata.</desc>
  <rect width="1000" height="300" rx="20" fill="#101827"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="500" y="42" font-size="24" font-weight="bold" fill="#f1f5f9">Alpha158 Enhanced · 158 + 26 = 184</text>
    <g fill="#1e293b" stroke="#64748b"><rect x="25" y="78" width="174" height="108" rx="12"/><rect x="219" y="78" width="174" height="108" rx="12"/><rect x="413" y="78" width="174" height="108" rx="12"/><rect x="607" y="78" width="174" height="108" rx="12"/><rect x="801" y="78" width="174" height="108" rx="12"/></g>
    <g fill="#67e8f9" font-size="27" font-weight="bold"><text x="112" y="119">158</text><text x="306" y="119">+11</text><text x="500" y="119">+6</text><text x="694" y="119">+5</text><text x="888" y="119">+4</text></g>
    <g fill="#f1f5f9" font-size="18"><text x="112" y="153">Original</text><text x="306" y="153">Market</text><text x="500" y="153">Liquidity</text><text x="694" y="153">Relative</text><text x="888" y="153">Interaction</text></g>
    <text x="500" y="227" font-size="18" fill="#cbd5e1">ETL: all features → Training: selected groups → Prediction: saved feature order</text>
    <text x="500" y="266" font-size="16" fill="#94a3b8">Amount groups use history through T−1 · Same-day context uses signal-day close</text>
  </g>
</svg>
