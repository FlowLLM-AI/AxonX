<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="706" viewBox="0 0 1256 706" role="img" aria-labelledby="title desc">
  <title id="title">Agent access: independent integration paths</title>
  <desc id="desc">Choose a host and connection; the paths below are alternatives, not sequential stages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1240.0" height="690.0" rx="30" fill="#f5f8fc" stroke="#18324b" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b">
      <text x="44" y="48" font-size="32" font-weight="700" text-anchor="start">Agent access: independent integration paths</text>
      <text x="44" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Choose a host and connection; the paths below are alternatives, not sequential stages.</text>
      <rect x="40" y="126" width="350" height="200" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="158" font-size="23" font-weight="700" text-anchor="start">External Agent</text>
      <text x="64.0" y="190" font-size="18" font-weight="400" text-anchor="start">Model and sessions: host</text>
      <text x="64.0" y="217" font-size="18" font-weight="400" text-anchor="start">AxonX Skill / development guide</text>
      <text x="64.0" y="244" font-size="18" font-weight="400" text-anchor="start">CLI or /mcp + Bearer</text>
      <text x="64.0" y="271" font-size="18" font-weight="400" text-anchor="start">Live public Job catalog</text>
      <rect x="425" y="126" width="350" height="200" rx="20" fill="#e7f5f1" stroke="#a9d7ca" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="449.0" y="158" font-size="23" font-weight="700" text-anchor="start">Built-in Agent</text>
      <text x="449.0" y="190" font-size="18" font-weight="400" text-anchor="start">Model and sessions: AxonX</text>
      <text x="449.0" y="217" font-size="18" font-weight="400" text-anchor="start">Studio → Agent / agent_chat</text>
      <text x="449.0" y="244" font-size="18" font-weight="400" text-anchor="start">In-process Dispatcher bridge</text>
      <text x="449.0" y="271" font-size="18" font-weight="400" text-anchor="start">Configured job_tools</text>
      <rect x="810" y="126" width="350" height="200" rx="20" fill="#f0edff" stroke="#d1c6ed" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="834.0" y="158" font-size="23" font-weight="700" text-anchor="start">Browser WebMCP</text>
      <text x="834.0" y="190" font-size="18" font-weight="400" text-anchor="start">Optional browser API</text>
      <text x="834.0" y="217" font-size="18" font-weight="400" text-anchor="start">List / submit tools</text>
      <text x="834.0" y="244" font-size="18" font-weight="400" text-anchor="start">Local service hosting the page</text>
      <text x="834.0" y="271" font-size="18" font-weight="400" text-anchor="start">Does not follow remote target</text>
      <path d="M 215 326 V 387" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 600 326 V 387" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 985 326 V 387" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="40" y="388" width="1120" height="126" rx="20" fill="#ffffff" stroke="#ccd9e5" stroke-width="1.6" stroke-linecap="round" />
      <text x="64.0" y="420" font-size="23" font-weight="700" text-anchor="start">AxonX Job contracts and research records</text>
      <text x="64.0" y="452" font-size="18" font-weight="400" text-anchor="start">Discover Task definitions · Submit where enabled · Query status, lineage, and artifacts</text>
      <text x="64.0" y="479" font-size="18" font-weight="400" text-anchor="start">Each path exposes its own configured capabilities</text>
      <text x="600.0" y="602" font-size="17" font-weight="400" text-anchor="middle">Ordinary service MCP returns JobResponse; live task and Agent events use HTTP SSE.</text>
      <text x="600.0" y="628" font-size="17" font-weight="400" text-anchor="middle">The built-in Job list and SDK tool permissions are configured independently.</text>
    </g>
    <path d="M 44 574 H 1156" fill="none" stroke="#18324b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
