<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="646" viewBox="0 0 1256 646" role="img" aria-labelledby="title desc">
  <title id="title">Built-in Agent configuration: distinct responsibilities</title>
  <desc id="desc">Framework fields, SDK options, and project settings jointly shape the runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1240.0" height="630.0" rx="30" fill="#f5f8fc" stroke="#18324b" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b">
      <text x="44" y="48" font-size="32" font-weight="700" text-anchor="start">Built-in Agent configuration: distinct responsibilities</text>
      <text x="44" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Framework fields, SDK options, and project settings jointly shape the runtime.</text>
      <rect x="40" y="136" width="350" height="170" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="168" font-size="23" font-weight="700" text-anchor="start">AxonX configuration</text>
      <text x="64.0" y="200" font-size="18" font-weight="400" text-anchor="start">backend / job_tools</text>
      <text x="64.0" y="227" font-size="18" font-weight="400" text-anchor="start">load_dev_guide / language</text>
      <text x="64.0" y="254" font-size="18" font-weight="400" text-anchor="start">State and session store</text>
      <rect x="425" y="136" width="350" height="170" rx="20" fill="#f0edff" stroke="#d1c6ed" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="449.0" y="168" font-size="23" font-weight="700" text-anchor="start">SDK options</text>
      <text x="449.0" y="200" font-size="18" font-weight="400" text-anchor="start">Model / env / cwd</text>
      <text x="449.0" y="227" font-size="18" font-weight="400" text-anchor="start">Tool and permission settings</text>
      <text x="449.0" y="254" font-size="18" font-weight="400" text-anchor="start">Default: bypassPermissions</text>
      <rect x="810" y="136" width="350" height="170" rx="20" fill="#f0edff" stroke="#d1c6ed" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="834.0" y="168" font-size="23" font-weight="700" text-anchor="start">Project settings</text>
      <text x="834.0" y="200" font-size="18" font-weight="400" text-anchor="start">setting_sources: [project]</text>
      <text x="834.0" y="227" font-size="18" font-weight="400" text-anchor="start">Project instructions</text>
      <text x="834.0" y="254" font-size="18" font-weight="400" text-anchor="start">Optional skills / plugins</text>
      <path d="M 215 306 V 362" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 600 306 V 362" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 985 306 V 362" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="40" y="364" width="1120" height="112" rx="20" fill="#e7f5f1" stroke="#a9d7ca" stroke-width="1.6" stroke-linecap="round" />
      <text x="64.0" y="396" font-size="23" font-weight="700" text-anchor="start">Framework-managed session runtime</text>
      <text x="64.0" y="428" font-size="18" font-weight="400" text-anchor="start">Session UUID · Turn lock · Resume · Call depth · Event stream</text>
      <text x="600.0" y="542" font-size="17" font-weight="400" text-anchor="middle">Guide loading and Job tool exposure are independent settings.</text>
      <text x="600.0" y="568" font-size="17" font-weight="400" text-anchor="middle">Query-only Job tools do not make the entire SDK session read-only.</text>
    </g>
    <path d="M 44 514 H 1156" fill="none" stroke="#18324b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
