<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="586" viewBox="0 0 1256 586" role="img" aria-labelledby="title desc">
  <title id="title">Built-in Agent: inspect research evidence</title>
  <desc id="desc">Default Job tools query tasks and files; SDK capabilities have separate controls.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1240.0" height="570.0" rx="30" fill="#f5f8fc" stroke="#18324b" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b">
      <text x="44" y="48" font-size="32" font-weight="700" text-anchor="start">Built-in Agent: inspect research evidence</text>
      <text x="44" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Default Job tools query tasks and files; SDK capabilities have separate controls.</text>
      <rect x="40" y="142" width="250" height="138" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="174" font-size="23" font-weight="700" text-anchor="start">Scope</text>
      <text x="64.0" y="206" font-size="18" font-weight="400" text-anchor="start">Research question</text>
      <text x="64.0" y="233" font-size="18" font-weight="400" text-anchor="start">Task IDs / dates</text>
      <rect x="330" y="142" width="250" height="138" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="354.0" y="174" font-size="23" font-weight="700" text-anchor="start">Read</text>
      <text x="354.0" y="206" font-size="18" font-weight="400" text-anchor="start">Status / logs / graph</text>
      <text x="354.0" y="233" font-size="18" font-weight="400" text-anchor="start">Metadata / previews</text>
      <rect x="620" y="142" width="250" height="138" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="644.0" y="174" font-size="23" font-weight="700" text-anchor="start">Validate</text>
      <text x="644.0" y="206" font-size="18" font-weight="400" text-anchor="start">Coverage / units</text>
      <text x="644.0" y="233" font-size="18" font-weight="400" text-anchor="start">Costs / protocol</text>
      <rect x="910" y="142" width="250" height="138" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="934.0" y="174" font-size="23" font-weight="700" text-anchor="start">Explain</text>
      <text x="934.0" y="206" font-size="18" font-weight="400" text-anchor="start">Evidence + limitations</text>
      <text x="934.0" y="233" font-size="18" font-weight="400" text-anchor="start">Next investigation</text>
      <path d="M 290 211 H 330" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 580 211 H 620" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 870 211 H 910" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 1035 280 V 350 H 165 V 282" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="600" y="378" font-size="18" font-weight="400" text-anchor="middle">Continue with a refined question and explicit evidence gaps.</text>
      <text x="600.0" y="482" font-size="17" font-weight="400" text-anchor="middle">Cancel Agent turn: interrupt the session. Cancel Task: a separate research operation.</text>
      <text x="600.0" y="508" font-size="17" font-weight="400" text-anchor="middle">The query Job list does not define all permissions of the Agent SDK.</text>
    </g>
    <path d="M 44 454 H 1156" fill="none" stroke="#18324b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
