<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="514" viewBox="0 0 1056 514" role="img" aria-labelledby="title desc" aria-label="Three transports, one Job contract">
  <title id="title">Three transports, one Job contract</title>
  <desc id="desc">HTTP JSON and ordinary MCP return JobResponse; HTTP SSE ends with a result event.</desc>
  <defs>
    <marker id="a" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1040.0" height="498.0" rx="30" fill="#f4f8fc" stroke="#173653" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#173653">
      <text text-anchor="start" x="44" y="50" font-size="32" font-weight="700">Three transports, one Job contract</text>
      <rect x="50" y="190" width="235" height="90" rx="18.0" fill="#e4edfc" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="167.5" y="224" text-anchor="middle" font-size="20">Job invocation</text>
      <text x="167.5" y="252" text-anchor="middle" font-size="20">Public arguments</text>
      <rect x="400" y="85" width="530" height="90" rx="18.0" fill="#e2f3f0" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="424.0" y="119" text-anchor="start" font-size="20">HTTP JSON</text>
      <text x="424.0" y="147" text-anchor="start" font-size="20">JobResponse</text>
      <path stroke-linecap="round" stroke-linejoin="round" d="M285 235H340V130H395" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#a)" />
      <rect x="400" y="190" width="530" height="90" rx="18.0" fill="#e2f3f0" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="424.0" y="224" text-anchor="start" font-size="20">MCP tool</text>
      <text x="424.0" y="252" text-anchor="start" font-size="20">JobResponse</text>
      <path stroke-linecap="round" stroke-linejoin="round" d="M285 235H340V235H395" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#a)" />
      <rect x="400" y="295" width="530" height="90" rx="18.0" fill="#e2f3f0" stroke="#88b2cc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="424.0" y="329" text-anchor="start" font-size="20">HTTP SSE</text>
      <text x="424.0" y="357" text-anchor="start" font-size="20">Events → result</text>
      <path stroke-linecap="round" stroke-linejoin="round" d="M285 235H340V340H395" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#a)" />
      <text x="500.0" y="435.0" font-size="19" text-anchor="middle">Serving and authentication settings determine the live public catalog.</text>
    </g>
    <path d="M 44 407 H 956" fill="none" stroke="#173653" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
