<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="380" viewBox="0 0 1320 380" role="img" aria-labelledby="title desc">
<title id="title">Execute, observe and verify a Task</title>
<desc id="desc">Remote execution uses the cli Job; queries read the current metadata.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526176" stroke-width="1.7"/></marker></defs>
<rect x="8" y="8" width="1304" height="364" rx="22" fill="#faf9f5" stroke="#364152" stroke-width="2"/>
<g font-family="Comic Sans MS, Chalkboard SE, Comic Neue, cursive" fill="#243349">
<text x="36" y="51" font-size="28">Execute, observe and verify a Task</text>
<rect x="36.0" y="91" width="295.5" height="205" rx="16" fill="#e8f2f4" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="53.0" y="125" font-size="21" font-weight="bold">Discover schema</text>
<text x="53.0" y="167" font-size="16">get_task_def reads the</text>
<text x="53.0" y="191" font-size="16">service catalog; choose a</text>
<text x="53.0" y="215" font-size="16">Task registration.</text>
<path d="M334.5 193 H349.5" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="353.5" y="91" width="295.5" height="205" rx="16" fill="#f1ebf8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="370.5" y="125" font-size="21" font-weight="bold">Execute command</text>
<text x="370.5" y="167" font-size="16">cli argv starts exec; wait</text>
<text x="370.5" y="191" font-size="16">for output and process exit</text>
<text x="370.5" y="215" font-size="16">code.</text>
<path d="M652.0 193 H667.0" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="671.0" y="91" width="295.5" height="205" rx="16" fill="#eaf3e8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="688.0" y="125" font-size="21" font-weight="bold">Observe Task</text>
<text x="688.0" y="167" font-size="16">status, logs and wait_task</text>
<text x="688.0" y="191" font-size="16">read task_id and guard</text>
<text x="688.0" y="215" font-size="16">execution start time.</text>
<path d="M969.5 193 H984.5" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="988.5" y="91" width="295.5" height="205" rx="16" fill="#fff0dd" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="1005.5" y="125" font-size="21" font-weight="bold">Read evidence</text>
<text x="1005.5" y="167" font-size="16">Inspect output_params,</text>
<text x="1005.5" y="191" font-size="16">artifact revisions and</text>
<text x="1005.5" y="215" font-size="16">business quality results.</text>
<text x="36" y="329" font-size="16">Record target, workspace, task_id and started_at. A dropped execution connection requires inspection before retrying.</text>
</g></svg>
