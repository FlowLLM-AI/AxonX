<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="546" viewBox="0 0 1256 546" role="img" aria-labelledby="title desc">
  <title id="title">HTTP SSE: live updates and the final outcome</title>
  <desc id="desc">Intermediate event types depend on the Job; only the terminal result determines its outcome.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1240.0" height="530.0" rx="30" fill="#f5f8fc" stroke="#18324b" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b">
      <text x="44" y="48" font-size="32" font-weight="700" text-anchor="start">HTTP SSE: live updates and the final outcome</text>
      <text x="44" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Intermediate event types depend on the Job; only the terminal result determines its outcome.</text>
      <rect x="40" y="180" width="250" height="120" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="212" font-size="23" font-weight="700" text-anchor="start">POST Job events</text>
      <text x="64.0" y="244" font-size="18" font-weight="400" text-anchor="start">Open HTTP stream</text>
      <text x="64.0" y="271" font-size="18" font-weight="400" text-anchor="start">HTTP 200: connected</text>
      <rect x="420" y="128" width="360" height="96" rx="19.2" fill="#e7f5f1" stroke="#a9d7ca" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="444.0" y="160" font-size="23" font-weight="700" text-anchor="start">Task updates</text>
      <text x="444.0" y="192" font-size="18" font-weight="400" text-anchor="start">Optional progress / log</text>
      <rect x="420" y="282" width="360" height="96" rx="19.2" fill="#f0edff" stroke="#d1c6ed" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="444.0" y="314" font-size="23" font-weight="700" text-anchor="start">Agent updates</text>
      <text x="444.0" y="346" font-size="18" font-weight="400" text-anchor="start">Optional agent_message patches</text>
      <rect x="910" y="180" width="250" height="120" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="934.0" y="212" font-size="23" font-weight="700" text-anchor="start">result</text>
      <text x="934.0" y="244" font-size="18" font-weight="400" text-anchor="start">success + answer</text>
      <text x="934.0" y="271" font-size="18" font-weight="400" text-anchor="start">Final Job outcome</text>
      <path d="M 290 225 H 355 V 176 H 420" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 290 255 H 355 V 330 H 420" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 780 176 H 845 V 225 H 910" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 780 330 H 845 V 255 H 910" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <text x="600.0" y="442" font-size="17" font-weight="400" text-anchor="middle">A closed connection without a terminal result does not establish success.</text>
      <text x="600.0" y="468" font-size="17" font-weight="400" text-anchor="middle">For a submit Job, successful acceptance still requires a separate check of Task completion.</text>
    </g>
    <path d="M 44 414 H 1156" fill="none" stroke="#18324b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
