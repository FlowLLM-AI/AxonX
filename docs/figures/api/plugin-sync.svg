<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="666" viewBox="0 0 1256 666" role="img" aria-labelledby="title desc">
  <title id="title">Plugin and Task sync: different destinations</title>
  <desc id="desc">Upload stages bytes; the consumer determines validation and what changes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1240.0" height="650.0" rx="30" fill="#f5f8fc" stroke="#18324b" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b">
      <text x="44" y="48" font-size="32" font-weight="700" text-anchor="start">Plugin and Task sync: different destinations</text>
      <text x="44" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Upload stages bytes; the consumer determines validation and what changes.</text>
      <rect x="40" y="218" width="250" height="144" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="250" font-size="23" font-weight="700" text-anchor="start">POST /files</text>
      <text x="64.0" y="282" font-size="18" font-weight="400" text-anchor="start">Returned relative path</text>
      <text x="64.0" y="309" font-size="18" font-weight="400" text-anchor="start">SHA-256 checksum</text>
      <rect x="420" y="136" width="310" height="144" rx="20" fill="#f0edff" stroke="#d1c6ed" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="444.0" y="168" font-size="23" font-weight="700" text-anchor="start">install_plugin</text>
      <text x="444.0" y="200" font-size="18" font-weight="400" text-anchor="start">Verified wheel</text>
      <text x="444.0" y="227" font-size="18" font-weight="400" text-anchor="start">Target Python environment</text>
      <rect x="850" y="136" width="310" height="144" rx="20" fill="#f0edff" stroke="#d1c6ed" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="874.0" y="168" font-size="23" font-weight="700" text-anchor="start">Refresh / restart</text>
      <text x="874.0" y="200" font-size="18" font-weight="400" text-anchor="start">Check restart_required</text>
      <text x="874.0" y="227" font-size="18" font-weight="400" text-anchor="start">Check live Task catalog</text>
      <rect x="420" y="338" width="310" height="144" rx="20" fill="#e7f5f1" stroke="#a9d7ca" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="444.0" y="370" font-size="23" font-weight="700" text-anchor="start">sync_tasks</text>
      <text x="444.0" y="402" font-size="18" font-weight="400" text-anchor="start">Verified Task archive</text>
      <text x="444.0" y="429" font-size="18" font-weight="400" text-anchor="start">Terminal Task snapshots</text>
      <rect x="850" y="338" width="310" height="144" rx="20" fill="#e7f5f1" stroke="#a9d7ca" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="874.0" y="370" font-size="23" font-weight="700" text-anchor="start">Apply workspace changes</text>
      <text x="874.0" y="402" font-size="18" font-weight="400" text-anchor="start">Replace Task directories</text>
      <text x="874.0" y="429" font-size="18" font-weight="400" text-anchor="start">Deletion-only calls: no upload</text>
      <path d="M 290 266 H 355 V 208 H 420" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 290 316 H 355 V 410 H 420" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 730 208 H 850" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 730 410 H 850" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <text x="600.0" y="562" font-size="17" font-weight="400" text-anchor="middle">Plugin installation changes the environment; Task sync changes persisted records.</text>
      <text x="600.0" y="588" font-size="17" font-weight="400" text-anchor="middle">Sync does not migrate active workers, raw market data, Agent sessions, or plugin environments.</text>
    </g>
    <path d="M 44 534 H 1156" fill="none" stroke="#18324b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
