<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="440" viewBox="0 0 1320 440" role="img" aria-labelledby="title desc">
<title id="title">Plugin installation and display synchronization</title>
<desc id="desc">Both consume staged uploads, with different path fields and different effects.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#52738f" stroke-width="1.6"/></marker></defs>
<rect x="8" y="8" width="1304" height="424" rx="24" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#18324b" data-diagram-content="true">
<text x="40" y="53" font-size="28" font-weight="700">Plugin installation and display synchronization</text>
<text x="40" y="84" font-size="17" fill="#52738f">Both consume staged uploads, with different path fields and different effects.</text>
<rect x="40" y="124" width="600" height="204" rx="16" fill="#f0edff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="60" y="158" font-size="22" font-weight="700">Plugin installation</text>
<text x="60" y="194" font-size="18">Build wheel → POST /upload</text>
<text x="60" y="221" font-size="18">cli argv: [plugin, install, uploaded.location]</text>
<text x="60" y="248" font-size="18">Changes the target Python environment.</text>
<text x="60" y="275" font-size="18">Restart persistent service; verify Task definitions.</text>
<rect x="680" y="124" width="600" height="204" rx="16" fill="#e7f5f1" stroke="#b8cadb" stroke-width="1.5"/>
<text x="700" y="158" font-size="22" font-weight="700">Display synchronization</text>
<text x="700" y="194" font-size="18">Build display archive → POST /upload</text>
<text x="700" y="221" font-size="18">sync_tasks: { path: uploaded.path }</text>
<text x="700" y="248" font-size="18">Copies bounded evidence and replica metadata.</text>
<text x="700" y="275" font-size="18">Replicas cannot execute or supply research inputs.</text>
<text x="40" y="370" font-size="17">Use the same destination for upload and consumption. Cleanup uses the staged relative path in both flows.</text>
<text x="40" y="401" font-size="17">Installing a plugin does not transfer research data. Synchronizing results does not install a plugin or restore a process.</text>
</g>
</svg>
