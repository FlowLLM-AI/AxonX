<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-upstream HTTP proxy</title>
  <desc id="desc">Append a routed path to the fixed upstream prefix and preserve request content.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect width="1040" height="640" rx="20" fill="#f8fafc" />
  <g font-family="Comic Sans MS, Bradley Hand, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#143252">
    <text x="520.0" y="55" font-size="30" font-weight="700" text-anchor="middle">Fixed-upstream HTTP proxy</text>
    <path d="M 315 220 L 375 220" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 660 220 L 720 220" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 865 306 L 865 335 L 175 335 L 175 362" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 315 450 L 375 450" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 660 450 L 720 450" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="140" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <text x="175.0" y="178" text-anchor="middle" font-size="23" font-weight="600">Client request</text>
    <rect x="385" y="140" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="520.0" y="178" text-anchor="middle" font-size="23" font-weight="600">Proxy component</text>
    <rect x="730" y="140" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <text x="865.0" y="178" text-anchor="middle" font-size="23" font-weight="600">Upstream request</text>
    <rect x="40" y="370" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="175.0" y="408" text-anchor="middle" font-size="23" font-weight="600">Upstream response</text>
    <text x="175.0" y="450" text-anchor="middle" font-size="18">Status and content stream</text>
    <rect x="385" y="370" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <rect x="730" y="370" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="865.0" y="408" text-anchor="middle" font-size="23" font-weight="600">Client response</text>
    <text x="865.0" y="450" text-anchor="middle" font-size="18">Consume upstream format</text>
    <text x="44" y="572" font-size="19" fill="#52677e">Proxy responses do not use JobResponse. Targeted Job forwarding is a separate protocol.</text>
    <text x="520.0" y="92.0" font-size="19" fill="#52677e" text-anchor="middle">Append a routed path to the fixed upstream prefix and preserve request content.</text>
    <text x="175.0" y="220" text-anchor="middle" font-size="18">Named proxy route and</text>
    <text x="175.0" y="248" text-anchor="middle" font-size="18">path</text>
    <text x="520.0" y="220" text-anchor="middle" font-size="18">Select the fixed HTTP</text>
    <text x="520.0" y="248" text-anchor="middle" font-size="18">upstream</text>
    <text x="865.0" y="220" text-anchor="middle" font-size="18">Method, query, headers</text>
    <text x="865.0" y="248" text-anchor="middle" font-size="18">and body</text>
    <text x="520.0" y="406" text-anchor="middle" font-size="23" font-weight="600">Filter transport</text>
    <text x="520.0" y="441" text-anchor="middle" font-size="23" font-weight="600">headers</text>
    <text x="520.0" y="475" text-anchor="middle" font-size="18">Regenerate length and</text>
    <text x="520.0" y="503" text-anchor="middle" font-size="18">encoding</text>
  </g>
</svg>
