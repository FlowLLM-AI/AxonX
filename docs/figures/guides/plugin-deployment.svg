<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="380" viewBox="0 0 1320 380" role="img" aria-labelledby="title desc">
<title id="title">Deploy a local plugin to a remote service</title>
<desc id="desc">Local build, upload, remote install, cleanup and restart are explicit operations.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526176" stroke-width="1.7"/></marker></defs>
<rect x="8" y="8" width="1304" height="364" rx="22" fill="#faf9f5" stroke="#364152" stroke-width="2"/>
<g font-family="Comic Sans MS, Chalkboard SE, Comic Neue, cursive" fill="#243349">
<text x="36" y="51" font-size="28">Deploy a local plugin to a remote service</text>
<rect x="36.0" y="91" width="232.0" height="205" rx="16" fill="#e8f2f4" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="53.0" y="125" font-size="21" font-weight="bold">1. Local build</text>
<text x="53.0" y="167" font-size="16">Build a wheel; record</text>
<text x="53.0" y="191" font-size="16">its filename and</text>
<text x="53.0" y="215" font-size="16">SHA-256.</text>
<path d="M271.0 193 H286.0" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="290.0" y="91" width="232.0" height="205" rx="16" fill="#f1ebf8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="307.0" y="125" font-size="21" font-weight="bold">2. Upload</text>
<text x="307.0" y="167" font-size="16">POST /upload returns</text>
<text x="307.0" y="191" font-size="16">absolute location and</text>
<text x="307.0" y="215" font-size="16">relative path.</text>
<path d="M525.0 193 H540.0" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="544.0" y="91" width="232.0" height="205" rx="16" fill="#eaf3e8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="561.0" y="125" font-size="21" font-weight="bold">3. Remote install</text>
<text x="561.0" y="167" font-size="16">cli argv: plugin</text>
<text x="561.0" y="191" font-size="16">install LOCATION;</text>
<text x="561.0" y="215" font-size="16">inspect exit code and</text>
<text x="561.0" y="239" font-size="16">JSON.</text>
<path d="M779.0 193 H794.0" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="798.0" y="91" width="232.0" height="205" rx="16" fill="#fff0dd" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="815.0" y="125" font-size="21" font-weight="bold">4. Cleanup</text>
<text x="815.0" y="167" font-size="16">DELETE /upload using</text>
<text x="815.0" y="191" font-size="16">path, including after</text>
<text x="815.0" y="215" font-size="16">install failure.</text>
<path d="M1033.0 193 H1048.0" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="1052.0" y="91" width="232.0" height="205" rx="16" fill="#e8eef8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="1069.0" y="125" font-size="21" font-weight="bold">5. Refresh &amp;</text>
<text x="1069.0" y="150" font-size="21" font-weight="bold">verify</text>
<text x="1069.0" y="192" font-size="16">Restart the service;</text>
<text x="1069.0" y="216" font-size="16">query Task definitions</text>
<text x="1069.0" y="240" font-size="16">and installed</text>
<text x="1069.0" y="264" font-size="16">metadata.</text>
<text x="36" y="329" font-size="16">Use the same target and token throughout. --target forwards arguments; it does not transfer local files. Cleanup does not roll back</text>
<text x="36" y="351" font-size="16">installation.</text>
</g></svg>
