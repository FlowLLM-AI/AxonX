<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="704" viewBox="0 0 1096 704" role="img" aria-labelledby="title desc">
  <title id="title">Authentication layers</title>
  <desc id="desc">Service credentials protect protocols; proxy requests use upstream credentials.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1080.0" height="688.0" rx="30" fill="#f8fafc" stroke="#143252" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#143252">
      <text x="44" y="55" font-size="32" font-weight="700" text-anchor="start">Authentication layers</text>
      <path d="M 315 220 L 375 220" stroke="#247baf" stroke-width="2.2" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 660 220 L 720 220" stroke="#247baf" stroke-width="2.2" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 315 450 L 375 450" stroke="#247baf" stroke-width="2.2" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 660 450 L 720 450" stroke="#247baf" stroke-width="2.2" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="40" y="140" width="270" height="160" rx="20" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="178" text-anchor="start" font-size="23.0" font-weight="600">Browser / client</text>
      <text x="64.0" y="220" text-anchor="start" font-size="18">Local service credentials</text>
      <rect x="385" y="140" width="270" height="160" rx="20" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="409.0" y="178" text-anchor="start" font-size="23.0" font-weight="600">Protocol routes</text>
      <rect x="730" y="140" width="270" height="160" rx="20" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="754.0" y="178" text-anchor="start" font-size="23.0" font-weight="600">Configured targets</text>
      <text x="754.0" y="220" text-anchor="start" font-size="18">Backend-owned credentials</text>
      <rect x="40" y="370" width="270" height="160" rx="20" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="408" text-anchor="start" font-size="23.0" font-weight="600">Proxy request</text>
      <rect x="385" y="370" width="270" height="160" rx="20" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="409.0" y="408" text-anchor="start" font-size="23.0" font-weight="600">Named proxy route</text>
      <text x="409.0" y="450" text-anchor="start" font-size="18">Fixed upstream_base_url</text>
      <rect x="730" y="370" width="270" height="160" rx="20" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="754.0" y="408" text-anchor="start" font-size="23.0" font-weight="600">Upstream service</text>
      <text x="754.0" y="450" text-anchor="start" font-size="18">Own authentication rules</text>
      <text x="520.0" y="580.0" font-size="19" fill="#52677e" text-anchor="middle">requires_auth controls unauthenticated Job exposure. It is not a user or role model.</text>
      <text x="44" y="92.0" font-size="18" fill="#143252" text-anchor="start">Service credentials protect protocols; proxy requests use upstream credentials.</text>
      <text x="409.0" y="220" text-anchor="start" font-size="18">health / jobs / files /</text>
      <text x="409.0" y="248" text-anchor="start" font-size="18">mcp</text>
      <text x="64.0" y="450" text-anchor="start" font-size="18">Upstream credentials and</text>
      <text x="64.0" y="478" text-anchor="start" font-size="18">body</text>
    </g>
    <path d="M 44 552 H 996" fill="none" stroke="#143252" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
