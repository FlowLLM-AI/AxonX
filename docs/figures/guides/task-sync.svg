<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="400" viewBox="0 0 1320 400" role="img" aria-labelledby="title desc">
<title id="title">Display snapshots: terminal Tasks and opt-in live groups</title>
<desc id="desc">Transfer bounded evidence with verified source identity, file revisions and replica metadata.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#52738f" stroke-width="1.6"/></marker></defs>
<rect x="8" y="8" width="1304" height="384" rx="24" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#18324b" data-diagram-content="true">
<text x="40" y="53" font-size="28" font-weight="700">Display snapshots: terminal Tasks and opt-in live groups</text>
<text x="40" y="84" font-size="17" fill="#52738f">Transfer bounded evidence with verified source identity, file revisions and replica metadata.</text>
<rect x="40" y="116" width="286" height="176" rx="16" fill="#e8f1ff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="60" y="150" font-size="22" font-weight="700">Select source</text>
<text x="60" y="186" font-size="18">Terminal Task records</text>
<text x="60" y="213" font-size="18">or live_task_ids groups.</text>
<text x="60" y="240" font-size="18">Queue indexed changes.</text>
<path d="M 327 204 H 356" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="358" y="116" width="286" height="176" rx="16" fill="#f0edff" stroke="#b8cadb" stroke-width="1.5"/>
<text x="378" y="150" font-size="22" font-weight="700">Explicit sync_flush</text>
<text x="378" y="186" font-size="18">Reconcile and batch.</text>
<text x="378" y="213" font-size="18">Apply transfer budget.</text>
<text x="378" y="240" font-size="18">Sample or omit as needed.</text>
<path d="M 645 204 H 674" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="676" y="116" width="286" height="176" rx="16" fill="#e7f5f1" stroke="#b8cadb" stroke-width="1.5"/>
<text x="696" y="150" font-size="22" font-weight="700">Stage archive</text>
<text x="696" y="186" font-size="18">POST /upload</text>
<text x="696" y="213" font-size="18">Returns path, size,</text>
<text x="696" y="240" font-size="18">and absolute location.</text>
<path d="M 963 204 H 992" fill="none" stroke="#52738f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="994" y="116" width="286" height="176" rx="16" fill="#fff1dd" stroke="#b8cadb" stroke-width="1.5"/>
<text x="1014" y="150" font-size="22" font-weight="700">Apply on target</text>
<text x="1014" y="186" font-size="18">sync_tasks uses path.</text>
<text x="1014" y="213" font-size="18">Validate; replace or delete.</text>
<text x="1014" y="240" font-size="18">Rollback commit failures.</text>
<text x="40" y="332" font-size="17">Live groups bind parent and child snapshots to started_at and an ordered revision. Inspect sampling and omitted files.</text>
<text x="40" y="359" font-size="17">Replicas are for display. Raw data, plugin environments, Agent sessions and executable input snapshots need separate handling.</text>
</g>
</svg>
