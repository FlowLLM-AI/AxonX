<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Task snapshot sync</title>
  <desc id="desc">The sender coalesces changes; the receiver validates and replaces Task directories.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect width="1040" height="640" rx="20" fill="#f8fafc" />
  <g font-family="Comic Sans MS, Bradley Hand, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#143252">
    <text x="520.0" y="55" font-size="30" font-weight="700" text-anchor="middle">Terminal Task snapshot sync</text>
    <path d="M 315 220 L 375 220" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 660 220 L 720 220" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 865 306 L 865 335 L 175 335 L 175 362" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 315 450 L 375 450" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 660 450 L 720 450" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="140" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <text x="175.0" y="178" text-anchor="middle" font-size="23" font-weight="600">Source Repository</text>
    <rect x="385" y="140" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="520.0" y="178" text-anchor="middle" font-size="23" font-weight="600">sync_flush</text>
    <rect x="730" y="140" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <text x="865.0" y="178" text-anchor="middle" font-size="23" font-weight="600">HTTP file upload</text>
    <text x="865.0" y="220" text-anchor="middle" font-size="18">Staged path and checksum</text>
    <rect x="40" y="370" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="175.0" y="408" text-anchor="middle" font-size="23" font-weight="600">Target sync_tasks</text>
    <rect x="385" y="370" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <text x="520.0" y="408" text-anchor="middle" font-size="23" font-weight="600">Apply or delete</text>
    <rect x="730" y="370" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="865.0" y="475" text-anchor="middle" font-size="18">Requeue failed changes</text>
    <text x="44" y="572" font-size="19" fill="#52677e">Raw data, Agent sessions and plugin environments are outside Task snapshot sync.</text>
    <text x="520.0" y="92.0" font-size="19" fill="#52677e" text-anchor="middle">The sender coalesces changes; the receiver validates and replaces Task directories.</text>
    <text x="175.0" y="220" text-anchor="middle" font-size="18">Changes and terminal</text>
    <text x="175.0" y="248" text-anchor="middle" font-size="18">filtering</text>
    <text x="520.0" y="220" text-anchor="middle" font-size="18">Filters, budgets and</text>
    <text x="520.0" y="248" text-anchor="middle" font-size="18">archives</text>
    <text x="175.0" y="450" text-anchor="middle" font-size="18">Validate archive and</text>
    <text x="175.0" y="478" text-anchor="middle" font-size="18">directories</text>
    <text x="520.0" y="450" text-anchor="middle" font-size="18">Replace; roll back on</text>
    <text x="520.0" y="478" text-anchor="middle" font-size="18">failure</text>
    <text x="865.0" y="406" text-anchor="middle" font-size="23" font-weight="600">Source</text>
    <text x="865.0" y="441" text-anchor="middle" font-size="23" font-weight="600">acknowledgement</text>
  </g>
</svg>
