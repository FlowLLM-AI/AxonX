<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="704" viewBox="0 0 1096 704" role="img" aria-labelledby="title desc">
  <title id="title">From submission to verified output</title>
  <desc id="desc">Discover the definition, preserve the handle, then verify state and artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1080.0" height="688.0" rx="30" fill="#f8fafc" stroke="#143252" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <path d="M 385 450 H 310" fill="none" stroke="#247baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 730 450 H 655" fill="none" stroke="#247baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 865 300 V 370" fill="none" stroke="#247baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 655 220 H 730" fill="none" stroke="#247baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 310 220 H 385" fill="none" stroke="#247baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#143252">
      <text x="44" y="55" font-size="32" font-weight="700" text-anchor="start">From submission to verified output</text>
      <rect x="40" y="140" width="270" height="160" rx="20" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="245" text-anchor="start" font-size="18">get_task_definition</text>
      <rect x="385" y="140" width="270" height="160" rx="20" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="409.0" y="245" text-anchor="start" font-size="18">submit -&gt; TaskHandle</text>
      <rect x="730" y="140" width="270" height="160" rx="20" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="754.0" y="178" text-anchor="start" font-size="23.0" font-weight="600">Wait or follow</text>
      <text x="754.0" y="220" text-anchor="start" font-size="18">wait_task / stream_task</text>
      <rect x="730.0" y="370" width="270" height="160" rx="20" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="754.0" y="408" text-anchor="start" font-size="23.0" font-weight="600">Inspect status</text>
      <text x="754.0" y="450" text-anchor="start" font-size="18">state / error / exit_code</text>
      <rect x="385.0" y="370" width="270" height="160" rx="20" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="409.0" y="408" text-anchor="start" font-size="23.0" font-weight="600">Read logs</text>
      <rect x="40.0" y="370" width="270" height="160" rx="20" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="475" text-anchor="start" font-size="18">metadata and artifacts</text>
      <text x="520.0" y="580.0" font-size="19" fill="#52677e" text-anchor="middle">Active Tasks cannot be replaced by a named rerun. Use unique names to preserve experiments.</text>
      <text x="44" y="92.0" font-size="18" fill="#143252" text-anchor="start">Discover the definition, preserve the handle, then verify state and artifacts.</text>
      <text x="64.0" y="176" text-anchor="start" font-size="23.0" font-weight="600">Discover and</text>
      <text x="64.0" y="211" text-anchor="start" font-size="23.0" font-weight="600">validate</text>
      <text x="409.0" y="176" text-anchor="start" font-size="23.0" font-weight="600">Submit and save</text>
      <text x="409.0" y="211" text-anchor="start" font-size="23.0" font-weight="600">identity</text>
      <text x="409.0" y="450" text-anchor="start" font-size="18">read_task_log: byte</text>
      <text x="409.0" y="478" text-anchor="start" font-size="18">windows</text>
      <text x="64.0" y="406" text-anchor="start" font-size="23.0" font-weight="600">Verify research</text>
      <text x="64.0" y="441" text-anchor="start" font-size="23.0" font-weight="600">output</text>
    </g>
    <path d="M 44 552 H 996" fill="none" stroke="#143252" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
