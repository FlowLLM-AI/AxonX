<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">From submission to verified output</title>
  <desc id="desc">Discover the definition, preserve the handle, then verify state and artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect width="1040" height="640" rx="20" fill="#f8fafc" />
  <g font-family="Comic Sans MS, Bradley Hand, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#143252">
    <text x="520.0" y="55" font-size="30" font-weight="700" text-anchor="middle">From submission to verified output</text>
    <path d="M 315 220 L 375 220" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 660 220 L 720 220" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 865 306 L 865 335 L 175 335 L 175 362" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 315 450 L 375 450" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 660 450 L 720 450" stroke="#247baf" stroke-width="1.45" fill="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="140" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <text x="175.0" y="245" text-anchor="middle" font-size="18">get_task_definition</text>
    <rect x="385" y="140" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="520.0" y="245" text-anchor="middle" font-size="18">submit -&gt; TaskHandle</text>
    <rect x="730" y="140" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <text x="865.0" y="178" text-anchor="middle" font-size="23" font-weight="600">Wait or follow</text>
    <text x="865.0" y="220" text-anchor="middle" font-size="18">wait_task / stream_task</text>
    <rect x="40" y="370" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="175.0" y="408" text-anchor="middle" font-size="23" font-weight="600">Inspect status</text>
    <text x="175.0" y="450" text-anchor="middle" font-size="18">state / error / exit_code</text>
    <rect x="385" y="370" width="270" height="160" rx="12" fill="#e9f1fc" stroke="#739bcc" stroke-width="1.5" />
    <text x="520.0" y="408" text-anchor="middle" font-size="23" font-weight="600">Read logs</text>
    <rect x="730" y="370" width="270" height="160" rx="12" fill="#e8f5f0" stroke="#5aab8c" stroke-width="1.5" />
    <text x="865.0" y="475" text-anchor="middle" font-size="18">metadata and artifacts</text>
    <text x="44" y="572" font-size="19" fill="#52677e">Active Tasks cannot be replaced by a named rerun. Use unique names to preserve experiments.</text>
    <text x="520.0" y="92.0" font-size="19" fill="#52677e" text-anchor="middle">Discover the definition, preserve the handle, then verify state and artifacts.</text>
    <text x="175.0" y="176" text-anchor="middle" font-size="23" font-weight="600">Discover and</text>
    <text x="175.0" y="211" text-anchor="middle" font-size="23" font-weight="600">validate</text>
    <text x="520.0" y="176" text-anchor="middle" font-size="23" font-weight="600">Submit and save</text>
    <text x="520.0" y="211" text-anchor="middle" font-size="23" font-weight="600">identity</text>
    <text x="520.0" y="450" text-anchor="middle" font-size="18">read_task_log: byte</text>
    <text x="520.0" y="478" text-anchor="middle" font-size="18">windows</text>
    <text x="865.0" y="406" text-anchor="middle" font-size="23" font-weight="600">Verify research</text>
    <text x="865.0" y="441" text-anchor="middle" font-size="23" font-weight="600">output</text>
