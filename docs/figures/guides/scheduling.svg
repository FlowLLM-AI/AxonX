<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="380" viewBox="0 0 1320 380" role="img" aria-labelledby="title desc">
<title id="title">Cron triggers daemon-owned commands</title>
<desc id="desc">The service computes future trigger times; the daemon owns launched commands.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526176" stroke-width="1.7"/></marker></defs>
<rect x="8" y="8" width="1304" height="364" rx="22" fill="#faf9f5" stroke="#364152" stroke-width="2"/>
<g font-family="Comic Sans MS, Chalkboard SE, Comic Neue, cursive" fill="#243349">
<text x="36" y="51" font-size="28">Cron triggers daemon-owned commands</text>
<rect x="36.0" y="91" width="295.5" height="205" rx="16" fill="#e8f2f4" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="53.0" y="125" font-size="21" font-weight="bold">Configure cron</text>
<text x="53.0" y="167" font-size="16">A list of expression and</text>
<text x="53.0" y="191" font-size="16">local axonx exec command</text>
<text x="53.0" y="215" font-size="16">entries.</text>
<path d="M334.5 193 H349.5" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="353.5" y="91" width="295.5" height="205" rx="16" fill="#f1ebf8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="370.5" y="125" font-size="21" font-weight="bold">Trigger once</text>
<text x="370.5" y="167" font-size="16">Use application timezone;</text>
<text x="370.5" y="191" font-size="16">missed occurrences are not</text>
<text x="370.5" y="215" font-size="16">replayed.</text>
<path d="M652.0 193 H667.0" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="671.0" y="91" width="295.5" height="205" rx="16" fill="#eaf3e8" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="688.0" y="125" font-size="21" font-weight="bold">Daemon launch</text>
<text x="688.0" y="167" font-size="16">Start the configured command</text>
<text x="688.0" y="191" font-size="16">and record stdout/stderr.</text>
<path d="M969.5 193 H984.5" fill="none" stroke="#526176" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="988.5" y="91" width="295.5" height="205" rx="16" fill="#fff0dd" stroke="#687587" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="1005.5" y="125" font-size="21" font-weight="bold">Observe results</text>
<text x="1005.5" y="167" font-size="16">Inspect Task metadata and</text>
<text x="1005.5" y="191" font-size="16">artifacts; restart reloads</text>
<text x="1005.5" y="215" font-size="16">the cron list.</text>
<text x="36" y="329" font-size="16">Service restart stops future triggers temporarily and preserves daemon-owned scheduled commands. Concurrency policy belongs to the</text>
<text x="36" y="351" font-size="16">business or host.</text>
</g></svg>
