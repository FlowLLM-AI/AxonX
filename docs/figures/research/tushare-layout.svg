<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="616" viewBox="0 0 1256 616" role="img" aria-labelledby="title desc">
  <title id="title">Market-data downloads: two output locations</title>
  <desc id="desc">Download records and market-data files have different storage and reuse responsibilities.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1240.0" height="600.0" rx="30" fill="#f5f8fc" stroke="#18324b" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b">
      <text x="44" y="48" font-size="32" font-weight="700" text-anchor="start">Market-data downloads: two output locations</text>
      <text x="44" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#18324b">Download records and market-data files have different storage and reuse responsibilities.</text>
      <rect x="40" y="202" width="270" height="140" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="64.0" y="234" font-size="23" font-weight="700" text-anchor="start">Download Task</text>
      <text x="64.0" y="266" font-size="18" font-weight="400" text-anchor="start">Date interval + data groups</text>
      <text x="64.0" y="293" font-size="18" font-weight="400" text-anchor="start">Queries / retries / checks</text>
      <rect x="480" y="126" width="680" height="130" rx="20" fill="#e7f5f1" stroke="#a9d7ca" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="504.0" y="158" font-size="23" font-weight="700" text-anchor="start">Market-data location</text>
      <text x="504.0" y="190" font-size="18" font-weight="400" text-anchor="start">Static snapshots · Year / date partitions</text>
      <text x="504.0" y="217" font-size="18" font-weight="400" text-anchor="start">Raw data reused by subsequent ETL</text>
      <rect x="480" y="326" width="680" height="130" rx="20" fill="#e8f1ff" stroke="#a9c5e8" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="504.0" y="358" font-size="23" font-weight="700" text-anchor="start">Task workspace directory</text>
      <text x="504.0" y="390" font-size="18" font-weight="400" text-anchor="start">status.json · metadata.json · File lists / row counts</text>
      <text x="504.0" y="417" font-size="18" font-weight="400" text-anchor="start">Runtime evidence for this download execution</text>
      <path d="M 310 246 H 395 V 191 H 480" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 310 302 H 395 V 391 H 480" fill="none" stroke="#52738f" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <text x="600.0" y="512" font-size="17" font-weight="400" text-anchor="middle">Repeated downloads replace matching files. Task snapshot sync does not include raw market data.</text>
    </g>
    <path d="M 44 484 H 1156" fill="none" stroke="#18324b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
