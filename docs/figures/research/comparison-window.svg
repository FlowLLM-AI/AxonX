<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Align Dates, Then Recompute</title>
  <desc id="desc">Pair the same Top N only on dates with finite net returns on both sides.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect width="1000" height="440" rx="20" fill="#f5f9ff" />
  <g font-family="Comic Sans MS, Bradley Hand, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#163450">
    <text x="500" y="60" font-size="30" font-weight="700" text-anchor="middle">Align Dates, Then Recompute</text>
    <text x="500" y="102" font-size="19" text-anchor="middle">Pair the same Top N only on dates with finite net returns on both sides.</text>
    <rect x="50.0" y="160" width="198.75" height="192" rx="14" fill="#e4f0ff" stroke="#74a5d5" stroke-width="2" />
    <text x="149.375" y="202" text-anchor="middle" font-size="22" font-weight="700">Strategy A / B</text>
    <text x="149.375" y="260" text-anchor="middle" font-size="18">Daily artifacts</text>
    <text x="149.375" y="310" text-anchor="middle" font-size="18">
      <tspan x="149.375" dy="0">Separate</tspan>
      <tspan x="149.375" dy="28">experiments</tspan>
    </text>
    <path d="M 252.75 256 H 277.75" fill="none" stroke="#247baf" stroke-width="1.45" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="283.75" y="160" width="198.75" height="192" rx="14" fill="#e6f6ef" stroke="#6fbb9b" stroke-width="2" />
    <text x="383.125" y="202" text-anchor="middle" font-size="22" font-weight="700">Common Dates</text>
    <text x="383.125" y="260" text-anchor="middle" font-size="18">Date intersection</text>
    <text x="383.125" y="310" text-anchor="middle" font-size="18">Finite net returns</text>
    <path d="M 486.5 256 H 511.5" fill="none" stroke="#247baf" stroke-width="1.45" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="517.5" y="160" width="198.75" height="192" rx="14" fill="#e4f0ff" stroke="#74a5d5" stroke-width="2" />
    <text x="616.875" y="202" text-anchor="middle" font-size="22" font-weight="700">Visible Window</text>
    <text x="616.875" y="252" text-anchor="middle" font-size="18">
      <tspan x="616.875" dy="0">Selected date</tspan>
      <tspan x="616.875" dy="28">interval</tspan>
    </text>
    <text x="616.875" y="310" text-anchor="middle" font-size="18">
      <tspan x="616.875" dy="0">Matched</tspan>
      <tspan x="616.875" dy="28">observations</tspan>
    </text>
    <path d="M 720.25 256 H 745.25" fill="none" stroke="#247baf" stroke-width="1.45" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="751.25" y="160" width="198.75" height="192" rx="14" fill="#e6f6ef" stroke="#6fbb9b" stroke-width="2" />
    <text x="850.625" y="194" text-anchor="middle" font-size="22" font-weight="700">
      <tspan x="850.625" dy="0">Browser</tspan>
      <tspan x="850.625" dy="32">Metrics</tspan>
    </text>
    <text x="850.625" y="260" text-anchor="middle" font-size="18">Net: compounded</text>
    <text x="850.625" y="310" text-anchor="middle" font-size="18">Gross: summed</text>
    <text x="50" y="386" font-size="19">
      <tspan x="50" dy="0">Summary and comparison may differ. Matching annualization settings are used;</tspan>
      <tspan x="50" dy="29">otherwise, the annualization setting is 252.</tspan>
    </text>
  </g>
</svg>
