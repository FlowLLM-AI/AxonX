<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="512" viewBox="0 0 1056 512" role="img" aria-labelledby="title desc">
  <title id="title">Align Dates, Then Recompute</title>
  <desc id="desc">Pair the same Top N only on dates with finite net returns on both sides.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#247baf" />
    </marker>
  </defs>
  <rect x="8" y="8" width="1040.0" height="496.0" rx="30" fill="#f5f9ff" stroke="#163450" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.35" />
  <g transform="translate(28 28)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" data-diagram-content="true">
    <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#163450">
      <text x="44" y="60" font-size="32" font-weight="700" text-anchor="start">Align Dates, Then Recompute</text>
      <text x="44" y="102" font-size="18" text-anchor="start" fill="#163450">Pair the same Top N only on dates with finite net returns on both sides.</text>
      <rect x="50.0" y="160" width="198.75" height="192" rx="20" fill="#e4f0ff" stroke="#74a5d5" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="149.375" y="202" text-anchor="middle" font-size="22.7" font-weight="700">Strategy A / B</text>
      <text x="149.375" y="260" text-anchor="middle" font-size="18">Daily artifacts</text>
      <text x="149.375" y="310" text-anchor="middle" font-size="18">
        <tspan x="149.375" dy="0">Separate</tspan>
        <tspan x="149.375" dy="28">experiments</tspan>
      </text>
      <path d="M 252.75 256 H 277.75" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="283.75" y="160" width="198.75" height="192" rx="20" fill="#e6f6ef" stroke="#6fbb9b" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="383.125" y="202" text-anchor="middle" font-size="23" font-weight="700">Common Dates</text>
      <text x="383.125" y="260" text-anchor="middle" font-size="18">Date intersection</text>
      <text x="383.125" y="310" text-anchor="middle" font-size="18">Finite net returns</text>
      <path d="M 486.5 256 H 511.5" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="517.5" y="160" width="198.75" height="192" rx="20" fill="#e4f0ff" stroke="#74a5d5" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="616.875" y="202" text-anchor="middle" font-size="23" font-weight="700">Visible Window</text>
      <text x="616.875" y="252" text-anchor="middle" font-size="18">
        <tspan x="616.875" dy="0">Selected date</tspan>
        <tspan x="616.875" dy="28">interval</tspan>
      </text>
      <text x="616.875" y="310" text-anchor="middle" font-size="18">
        <tspan x="616.875" dy="0">Matched</tspan>
        <tspan x="616.875" dy="28">observations</tspan>
      </text>
      <path d="M 720.25 256 H 745.25" fill="none" stroke="#247baf" stroke-width="2.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="751.25" y="160" width="198.75" height="192" rx="20" fill="#e6f6ef" stroke="#6fbb9b" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" />
      <text x="850.625" y="194" text-anchor="middle" font-size="23" font-weight="700">
        <tspan x="850.625" dy="0">Browser</tspan>
        <tspan x="850.625" dy="32">Metrics</tspan>
      </text>
      <text x="850.625" y="260" text-anchor="middle" font-size="18">Net: compounded</text>
      <text x="850.625" y="310" text-anchor="middle" font-size="18">Gross: summed</text>
      <text x="50" y="402.0" font-size="19">
        <tspan x="50" dy="0">Summary and comparison may differ. Matching annualization settings are used;</tspan>
        <tspan x="50" dy="29">otherwise, the annualization setting is 252.</tspan>
      </text>
    </g>
    <path d="M 44 374 H 956" fill="none" stroke="#163450" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7" stroke-linecap="round" />
  </g>
</svg>
