<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="824" viewBox="0 0 1280 824" role="img" aria-labelledby="title desc">
  <title id="title">Stock backtests: targets, actual fills and daily equity</title>
  <desc id="desc">Scores and signal-time eligibility determine targets without future labels. Independent market/calendar data determines valuation and tradeability; optional labels support diagnostics. The ledger processes plugin events, marks unlocked positions, attempts due sells and funds targets from available cash. Equity includes net event receivables, which cannot fund buys before settlement. Combined positions retain individual costs and exit dates. Blocked exits retain capital. Published signals, orders, positions, trades, daily and summary artifacts distinguish target intent from actual exposure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" /></marker></defs>
  <rect x="8" y="8" width="1264" height="808" rx="30" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5" />
  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b" data-diagram-content="true">
    <text x="48" y="51" font-size="31" font-weight="700">Stock backtests: targets, actual fills and daily equity</text>
    <text x="48" y="83" font-size="18" fill="#52738f">Signal quality and portfolio accounting use separate inputs and answer different questions.</text>
    <rect x="48" y="126" width="368" height="146" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="160" font-size="22" font-weight="700">Signals</text>
    <text x="72" y="192" font-size="17">Prediction scores + eligibility</text>
    <text x="72" y="218" font-size="17">Rank targets in the chosen universe</text>
    <text x="72" y="244" font-size="17">Selection uses no future labels.</text>
    <rect x="456" y="126" width="368" height="146" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="480" y="160" font-size="22" font-weight="700">Market + calendar</text>
    <text x="480" y="192" font-size="17">Independent prices and adjustments</text>
    <text x="480" y="218" font-size="17">Buy / sell flags · Trading dates</text>
    <text x="480" y="244" font-size="17">Missing quotes are not suspensions.</text>
    <rect x="864" y="126" width="368" height="146" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="888" y="160" font-size="22" font-weight="700">Labels (optional)</text>
    <text x="888" y="192" font-size="17">Fixed-next-market-day returns</text>
    <text x="888" y="218" font-size="17">IC · RankIC · NDCG · Benchmarks</text>
    <text x="888" y="244" font-size="17">Diagnostics do not set targets.</text>
    <rect x="32" y="330" width="1216" height="232" rx="20" fill="#ffffff" stroke="#bdcfdf" stroke-width="1.7" />
    <text x="48" y="366" font-size="18" font-weight="700" fill="#52738f">Shared position ledger · each Top N / universe has its own portfolio</text>
    <rect x="48" y="394" width="368" height="146" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="428" font-size="22" font-weight="700">Mark positions</text>
    <text x="72" y="460" font-size="17">Value existing holdings each day</text>
    <text x="72" y="486" font-size="17">Equity includes net receivables</text>
    <text x="72" y="512" font-size="17">Locked positions retain last marks.</text>
    <rect x="456" y="394" width="368" height="146" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="480" y="428" font-size="22" font-weight="700">Attempt due sells</text>
    <text x="480" y="460" font-size="17">Apply sell flags and executed fees</text>
    <text x="480" y="486" font-size="17">Blocked exits retain capital</text>
    <text x="480" y="512" font-size="17">No forced liquidation at cutoff.</text>
    <rect x="864" y="394" width="368" height="146" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="888" y="428" font-size="22" font-weight="700">Fund signal targets</text>
    <text x="888" y="460" font-size="17">Use available cash and capacity</text>
    <text x="888" y="486" font-size="17">Charge fees on executed buys</text>
    <text x="888" y="512" font-size="17">Unfilled targets are not backfilled.</text>
    <path d="M 232 272 L 232 330" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 640 272 L 640 330" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 416 467 L 456 467" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 824 467 L 864 467" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 640 562 L 640 602" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="48" y="602" width="1184" height="144" rx="20" fill="#ffffff" stroke="#bdcfdf" stroke-width="1.7" />
    <text x="72" y="636" font-size="23" font-weight="700">Published portfolio evidence</text>
    <text x="72" y="671" font-size="17">signals = targets · orders = fills / unfilled reasons · positions = actual exposure · trades = completed holdings</text>
    <text x="72" y="702" font-size="17">daily = equity / returns / costs · summary = original period metrics · incomplete_market_data = provisional evaluation</text>
    <text x="72" y="730" font-size="17" fill="#52738f">Daily net return = equity / previous equity − 1</text>
    <path d="M 1048 272 L 1250 272 L 1250 672 L 1232 672" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6" />
    <text x="48" y="799" font-size="16" fill="#52738f">Read the execution protocol, costs and data quality before interpreting results as a tradable strategy.</text>
  </g>
</svg>
