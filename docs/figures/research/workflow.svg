<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="818" viewBox="0 0 1280 818" role="img" aria-labelledby="title desc">
  <title id="title">Alpha158: data → models → portfolio evidence</title>
  <desc id="desc">Raw Tushare data feeds ETL. ETL publishes a feature dataset, labels, market data and calendar. Training consumes the ETL dataset; prediction consumes a model collection and compatible ETL data; backtesting consumes scores with independent market/calendar data and optional labels. Factor analysis branches from ETL. Upstream IDs record input dependencies, while parent/child calls record synchronous composition; neither graph auto-executes the pipeline.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" /></marker></defs>
  <rect x="8" y="8" width="1264" height="802" rx="30" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5" />
  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b" data-diagram-content="true">
    <text x="48" y="51" font-size="31" font-weight="700">Alpha158: data → models → portfolio evidence</text>
    <text x="48" y="83" font-size="18" fill="#52738f">Run stages explicitly or use the research parent Task; factor analysis is an optional ETL branch.</text>
    <rect x="48" y="134" width="248" height="138" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="168" font-size="20" font-weight="700">Tushare download</text>
    <text x="72" y="200" font-size="17">Raw files + master data</text>
    <text x="72" y="226" font-size="17">workspace/tushare/</text>
    <rect x="352" y="134" width="416" height="138" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="376" y="168" font-size="22" font-weight="700">ETL</text>
    <text x="376" y="200" font-size="17">Features · Labels · Market · Calendar</text>
    <text x="376" y="226" font-size="17">Dataset + statistics artifacts</text>
    <rect x="832" y="134" width="400" height="138" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="856" y="168" font-size="22" font-weight="700">Factor analysis (optional)</text>
    <text x="856" y="200" font-size="17">IC diagnostics · Quantile returns</text>
    <text x="856" y="226" font-size="17">result / quantiles artifacts</text>
    <path d="M 296 203 L 352 203" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 768 203 L 832 203" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 560 272 L 560 311 L 232 311 L 232 356" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="72" y="332" font-size="16" fill="#52738f">Feature dataset</text>
    <rect x="48" y="356" width="368" height="146" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="390" font-size="22" font-weight="700">Train</text>
    <text x="72" y="422" font-size="17">Read one successful ETL Task</text>
    <text x="72" y="448" font-size="17">Publish a verified model collection</text>
    <text x="72" y="474" font-size="17">models.json + model member artifacts</text>
    <rect x="456" y="356" width="368" height="146" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="480" y="390" font-size="22" font-weight="700">Predict</text>
    <text x="480" y="422" font-size="17">Read Train + compatible ETL</text>
    <text x="480" y="448" font-size="17">Out-of-sample scores + eligibility</text>
    <text x="480" y="474" font-size="17">Predictions contain no future labels.</text>
    <rect x="864" y="356" width="368" height="146" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="888" y="390" font-size="22" font-weight="700">Backtest</text>
    <text x="888" y="422" font-size="17">Scores + independent market/calendar</text>
    <text x="888" y="448" font-size="17">Optional labels for signal diagnostics</text>
    <text x="888" y="474" font-size="17">daily / summary / portfolio artifacts</text>
    <path d="M 416 429 L 456 429" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 824 429 L 864 429" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 728 272 L 728 307 L 800 307 L 800 356" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6" />
    <text x="822" y="314" font-size="15" fill="#52738f">ETL for prediction</text>
    <path d="M 752 272 L 752 290 L 1192 290 L 1192 356" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6" />
    <text x="992" y="323" font-size="15" fill="#52738f">Market / calendar / labels</text>
    <text x="48" y="553" font-size="18" font-weight="700" fill="#52738f">Two different relationships</text>
    <rect x="48" y="574" width="552" height="152" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="608" font-size="22" font-weight="700">Data dependencies</text>
    <text x="72" y="640" font-size="17">upstream_task_ids → consumed input references</text>
    <text x="72" y="666" font-size="17">get_task_graph follows these declared edges.</text>
    <text x="72" y="692" font-size="17">Verify success, revisions and feature semantics.</text>
    <rect x="680" y="574" width="552" height="152" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="704" y="608" font-size="22" font-weight="700">Parent / child composition</text>
    <text x="704" y="640" font-size="17">run_task() → synchronous child invocation</text>
    <text x="704" y="666" font-size="17">parent_task_id / children record the calls.</text>
    <text x="704" y="692" font-size="17">Children share the parent execution process.</text>
    <text x="48" y="763" font-size="16" fill="#52738f">Keep Task IDs + started_at + artifact revisions. A recorded edge does not automatically execute a stage.</text>
    <text x="48" y="792" font-size="16" fill="#52738f">Solid arrows: main inputs. Dashed arrows: additional ETL artifacts. Child-call relationships are recorded separately.</text>
  </g>
</svg>
