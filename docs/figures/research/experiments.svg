<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="706" viewBox="0 0 1280 706" role="img" aria-labelledby="title desc">
  <title id="title">Choose on development data; confirm on independent dates</title>
  <desc id="desc">Experiment design separates training/validation, candidate screening, locking and independent confirmation. Strategy comparison selects matching portfolio definitions and pairs dates with finite returns before recalculating visible-window metrics. Original summaries and paired comparison metrics cover different scopes; uncertainty and settings remain part of the conclusion.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#52738f" /></marker></defs>
  <rect x="8" y="8" width="1264" height="690" rx="30" fill="#f5f8fc" stroke="#ccd9e5" stroke-width="1.5" />
  <g font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" fill="#18324b" data-diagram-content="true">
    <text x="48" y="51" font-size="31" font-weight="700">Choose on development data; confirm on independent dates</text>
    <text x="48" y="83" font-size="18" fill="#52738f">Retain distinct Task identities and fixed controls before comparing research improvements.</text>
    <text x="48" y="123" font-size="18" font-weight="700" fill="#52738f">Experiment design · keep data, timing, universe, costs and execution assumptions controlled</text>
    <rect x="48" y="142" width="272" height="146" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="176" font-size="20" font-weight="700">Fit &amp; validate</text>
    <text x="72" y="208" font-size="17">Training window</text>
    <text x="72" y="234" font-size="17">Select fitting parameters</text>
    <rect x="352" y="142" width="272" height="146" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="376" y="176" font-size="20" font-weight="700">Screen candidates</text>
    <text x="376" y="208" font-size="17">Development window</text>
    <text x="376" y="234" font-size="15.5">Apply a declared selection rule</text>
    <path d="M 320 215 L 352 215" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="656" y="142" width="272" height="146" rx="20" fill="#fff2df" stroke="#dfc89e" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="680" y="176" font-size="20" font-weight="700">Lock the choice</text>
    <text x="680" y="208" font-size="17">Freeze settings + code</text>
    <text x="680" y="234" font-size="16">Retain baseline and candidate</text>
    <path d="M 624 215 L 656 215" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="960" y="142" width="272" height="146" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="984" y="176" font-size="20" font-weight="700">Confirm</text>
    <text x="984" y="208" font-size="17">Independent dates</text>
    <text x="984" y="234" font-size="16.5">Keep the locked choice fixed</text>
    <path d="M 928 215 L 960 215" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="48" y="340" font-size="18" font-weight="700" fill="#52738f">Comparison · check both settings and the effective observation window</text>
    <rect x="48" y="360" width="368" height="178" rx="20" fill="#f0edff" stroke="#cfc2ed" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="72" y="394" font-size="22" font-weight="700">Select two Backtests</text>
    <text x="72" y="426" font-size="17">Same universe and common Top N</text>
    <text x="72" y="452" font-size="17">Inspect prediction sources and costs</text>
    <text x="72" y="478" font-size="17">Keep both Task IDs + started_at</text>
    <text x="72" y="504" font-size="17">Confirm protocol / annualization.</text>
    <rect x="456" y="360" width="368" height="178" rx="20" fill="#e8f1ff" stroke="#a7c4e6" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="480" y="394" font-size="22" font-weight="700">Pair common dates</text>
    <text x="480" y="426" font-size="17">A dates: 01, 02, 03, 04</text>
    <text x="480" y="452" font-size="17">B dates: 02, 03, 04, 05</text>
    <text x="480" y="478" font-size="17">Both finite: 02, 03, 04</text>
    <text x="480" y="504" font-size="17">Then apply the visible date window.</text>
    <rect x="864" y="360" width="368" height="178" rx="20" fill="#e6f5ef" stroke="#9ccfbf" stroke-width="1.7" stroke-dasharray="8 6" />
    <text x="888" y="394" font-size="22" font-weight="700">Recompute &amp; explain</text>
    <text x="888" y="426" font-size="17">Compound daily net returns</text>
    <text x="888" y="452" font-size="17">Recompute window return and risk</text>
    <text x="888" y="478" font-size="17">Use paired finite signal metrics</text>
    <text x="888" y="504" font-size="17">Report samples, gaps and limitations.</text>
    <path d="M 416 449 L 456 449" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 824 449 L 864 449" fill="none" stroke="#52738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="48" y="580" width="1184" height="72" rx="20" fill="#ffffff" stroke="#bdcfdf" stroke-width="1.7" />
    <text x="72" y="612" font-size="17" font-weight="700">Saved Task summaries describe their original scope; comparison metrics describe the common visible window.</text>
    <text x="72" y="638" font-size="16" fill="#52738f">Matching dates alone does not establish matching research settings or independent confirmation.</text>
    <text x="48" y="684" font-size="16" fill="#52738f">Keep the daily artifacts and calculation definitions. Studio does not automatically perform uncertainty tests.</text>
  </g>
</svg>
